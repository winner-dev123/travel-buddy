# Local development stack. Not for production (see docs/11).
# Usage: docker compose up -d        (dependencies only)
#        docker compose --profile api up -d --build   (dependencies + backend API)
name: travelbuddy

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: travelbuddy
      POSTGRES_PASSWORD: travelbuddy
      POSTGRES_DB: travelbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbuddy -d travelbuddy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: travelbuddy
      MINIO_ROOT_PASSWORD: travelbuddy-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 travelbuddy travelbuddy-dev-secret &&
      mc mb --ignore-existing local/tb-quarantine local/tb-public local/tb-private &&
      mc ilm rule add --expire-days 1 local/tb-quarantine || true
      "

  api:
    profiles: ["api"]
    build: ./backend
    environment:
      APP_ENV: development
      LOG_JSON: "false"
      DATABASE_URL: postgresql+asyncpg://travelbuddy:travelbuddy@postgres:5432/travelbuddy
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
