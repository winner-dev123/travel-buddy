# gitleaks configuration: default rules plus a narrow allowlist for values that are
# deliberately non-secret (labelled development-only defaults, test fixtures and documented
# example identifiers). Keep this list small and specific; never allowlist whole source
# directories. (gitleaks v8.24 reads this legacy single-table form.)
title = "Travel Buddy secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Labelled development-only defaults, test fixtures and documented examples"
paths = [
  '''^backend/tests/''',
  '''\.test\.tsx?$''',
  '''^contracts/tools/validate_realtime\.py$''',  # sample frames with fake tokens
]
regexes = [
  '''^dev-only-[a-z-]+$''',                 # e.g. backend CURSOR_SIGNING_KEY dev default
  '''^[a-z-]*development-only[a-z-]*$''',   # web dev session / mock token keys
  '''^travelbuddy-dev-secret$''',           # local MinIO password in docker-compose
  # Exact example values flagged by generic-api-key (not credentials):
  '''^5b8c7d0e-2f1a-4c39-9a51-0d6c2e7f8a90$''',  # Idempotency-Key example, docs/05
  '''^lisbon-walk-28$''',                         # web mock post key, social.ts fixture
  # Firebase Web API key of travel-buddy-tb: public by design (it only identifies the project and
  # ships in every app; ADR-0028). Service-account keys are never committed.
  '''^AIzaSyCZvEdF4YFoKIWs2QPz1P7RI6kINcQ7G2s$''',
]
