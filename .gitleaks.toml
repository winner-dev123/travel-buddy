# gitleaks configuration: default rules plus narrow allowlists for values that are
# deliberately non-secret (labelled development-only defaults, test fixtures, and documented
# example identifiers). Keep these specific; never allowlist whole source directories.
title = "Travel Buddy secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Labelled development-only defaults and test fixtures"
paths = [
  '''^backend/tests/''',
  '''\.test\.tsx?$''',
  '''^contracts/tools/validate_realtime\.py$''',  # sample frames with fake tokens
]
regexes = [
  '''^dev-only-[a-z-]+$''',                 # e.g. backend CURSOR_SIGNING_KEY dev default
  '''^[a-z-]*development-only[a-z-]*$''',   # web dev session / mock token keys
  '''^travelbuddy-dev-secret$''',           # local MinIO password in docker-compose
]

[[allowlists]]
description = "Request identifiers in documentation examples (UUIDs, not credentials)"
regexTarget = "line"
regexes = [
  '''(?i)\b(Idempotency-Key|X-Request-ID)\s*:\s*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\s*$''',
]

[[allowlists]]
description = "Web mock fixture record keys (kebab-case slugs such as 'lisbon-walk-28')"
regexTarget = "line"
condition = "AND"   # both the path and the line shape must match
paths = ['''^packages/api-client/src/mock/fixtures/''']
regexes = ['''^\s*\{ key: '[a-z0-9]+(?:-[a-z0-9]+)*', ''']
