# Render Blueprint: backend API (docs/11, ADR-0018).
# Secrets are `sync: false`: Render prompts for them on first deploy and they never live in git.
services:
  - type: web
    name: travel-buddy-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia # same AWS region as the Supabase project (us-east-1)
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # Supabase session pooler URI with ?ssl=require (ADR-0018)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: DATABASE_TRANSACTION_POOLER
        value: "false"
      # No feature uses Redis yet; empty disables it (readiness then skips it).
      - key: REDIS_URL
        value: ""
      - key: CURSOR_SIGNING_KEY
        sync: false
      # Ed25519 private key, PKCS#8 PEM (single line with \n escapes is accepted)
      - key: PLATFORM_JWT_PRIVATE_KEY
        sync: false
      - key: REFRESH_TOKEN_DERIVATION_KEY
        sync: false
      # Trusted identity provider(s): Supabase Auth of the same project (ES256 JWKS)
      - key: OIDC_ISSUERS
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://travel-buddy-six-rho.vercel.app
      - key: DEV_IDP_ENABLED
        value: "false"
      - key: DEV_BILLING_ENABLED
        value: "false"
