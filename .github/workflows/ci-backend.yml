name: backend

on:
  # Also runnable by hand (Actions > Run workflow), for example after a CI outage.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - "docs/01-prd.md"
      - "scripts/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "docs/01-prd.md"
      - "scripts/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: lint + types + boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: mypy
      - name: Module boundaries (ADR-0001)
        run: pytest tests/unit/test_architecture_boundaries.py -q

  test:
    name: unit + integration + contract + security
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travelbuddy
          POSTGRES_PASSWORD: travelbuddy
          POSTGRES_DB: travelbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelbuddy -d travelbuddy_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://travelbuddy:travelbuddy@localhost:5432/travelbuddy_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests (integration tests run against the service containers)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Domain logic coverage >= 90 %
        run: >-
          coverage report --fail-under=90
          --include="app/modules/billing/entitlements.py,app/modules/*/domain.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  traceability:
    name: requirement traceability
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build matrix; fail on untraced Must requirements of completed phases
        run: python scripts/trace_requirements.py --enforce-phases 0 --output reports/traceability.md
      - uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: reports/traceability.md

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --strict --progress-spinner off .
      # The image also installs the `gcp` extra (pyproject.toml); keep this spec in sync with it.
      - run: |
          echo 'cloud-sql-python-connector[asyncpg]>=1.23,<2' > gcp-requirements.txt
          pip-audit --strict --progress-spinner off -r gcp-requirements.txt
