name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "contracts/openapi/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "contracts/openapi/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The web runs against the server-side mock adapter in CI (docs/web/01 §7.1).
  APP_ENV: test

jobs:
  check:
    name: lint + contract types + typecheck + unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Contract types are up to date with contracts/openapi
        run: npm run gen:types:check
      - name: Typecheck
        run: |
          (cd apps/web && npx next typegen)
          npm run typecheck
      - name: Unit tests
        run: npm test

  build-e2e:
    name: build + e2e (Playwright, axe)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E
        run: npx playwright test
        working-directory: apps/web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: container image builds
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build web image
        run: DOCKER_BUILDKIT=1 docker build -f apps/web/Dockerfile --build-arg APP_ENV=test -t travelbuddy-web:ci .
