name: mobile

on:
  # Also runnable by hand (Actions > Run workflow), for example after a CI outage.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-24.04
    # A stuck test run must fail fast instead of holding a runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
