name: security

on:
  # Also runnable by hand (Actions > Run workflow), for example after a CI outage.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 \
            --report-format json --report-path /repo/gitleaks-report.json --log-opts="--all"
      - name: Upload redacted findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
