  # ───────────────────────────── Traveler discovery (Phase 2) ─────────────────────────────
  /v1/travelers/discover:
    get:
      tags: [discovery]
      operationId: discoverTravelers
      summary: Discover opted-in travelers for a destination
      description: |
        **Reciprocity:** the caller must have `discovery_enabled` and either a visible active discovery session
        or a shared upcoming destination for the requested destination. Invisible users neither appear nor browse.

        **Scope:** `here_now` lists travelers with an active visible discovery session in the destination
        (defaults to the caller's own session destination). `upcoming` lists travelers who opted to share an
        upcoming trip to the destination with overlapping dates.

        Results never include coordinates, distances, last-seen times, or users blocked in either direction.
        Presence is reported only at city or (if both parties' granularity allows) neighborhood level. The query
        takes a destination, never a coordinate and radius, so trilateration is impossible.
      x-phase: 2
      x-requirements: [DISC-001, DISC-003, DISC-006, DISC-007, DISC-008, DISC-010, SAFE-011]
      x-rate-limit-class: discovery
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [here_now, upcoming], default: here_now }
        - name: destination_id
          in: query
          required: false
          description: Required for `upcoming`. For `here_now` defaults to the caller's session destination and must equal it or one of its neighborhoods.
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: travel_start_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: travel_end_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: travel_style
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/TravelStyle' }
          style: form
          explode: false
        - name: interest
          in: query
          required: false
          schema:
            type: array
            maxItems: 10
            items: { type: string, maxLength: 40 }
          style: form
          explode: false
        - name: language
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/LocaleTag' }
          style: form
          explode: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Traveler cards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelerCardPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`discovery_disabled` (caller not opted in / not visible), `consent_required`, or `age_restricted`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Connections (Phase 2) ─────────────────────────────
  /v1/connections/requests:
    get:
      tags: [connections]
      operationId: listConnectionRequests
      summary: List connection requests (incoming inbox or outgoing)
      x-phase: 2
      x-requirements: [CONN-001, CONN-004]
      x-rate-limit-class: read
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConnectionRequestStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Requests (newest first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequestPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [connections]
      operationId: createConnectionRequest
      summary: Send a connection request
      description: |
        A request never establishes a connection by itself. Rejected (with a single generic
        `connection_request_not_allowed`, to avoid revealing which rule applied) when the recipient's
        `connection_requests_from` setting disallows it, or when either party has blocked the other.
        `connection_request_cooldown` applies after a decline (default 30 days). `already_connected` if connected.
        Strict rate limits apply to unsolicited contact.
      x-phase: 2
      x-requirements: [CONN-001, CONN-002, CONN-003, CONN-005]
      x-rate-limit-class: contact
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnectionRequestRequest' }
      responses:
        '201':
          description: Request sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`connection_request_not_allowed` or `age_restricted`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`already_connected`, `connection_request_cooldown`, `conflict` (pending request exists), or `idempotency_key_reused`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/connections/requests/{connectionRequestId}/accept:
    post:
      tags: [connections]
