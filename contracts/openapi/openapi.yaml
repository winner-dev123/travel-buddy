  # ───────────────────────────── Destinations ─────────────────────────────
  /v1/destinations:
    get:
      tags: [destinations]
      operationId: listDestinations
      summary: List destinations (public directory and sitemap enumeration)
      description: |
        Anonymous-capable, cursor-paginated listing of **active** destinations for directory pages and XML
        sitemaps. Use `sort=slug` for complete enumeration: it is stable while the catalog changes, whereas
        `popularity` is recomputed nightly. Results are localized via `Accept-Language`.
      security: [{}, { bearerAuth: [] }]
      x-phase: 1
      x-requirements: [DEST-006, DEST-004, AUTH-012]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: kind
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/DestinationKind' }
          style: form
          explode: false
        - name: country
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: continent
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Continent' }
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [popularity, slug], default: popularity }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Destinations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationSummaryPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
