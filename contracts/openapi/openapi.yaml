webhooks:
  webCacheRevalidation:
    post:
      summary: Backend → web, purge cached public pages (SAFE-012)
      description: |
        Sent by the outbox relay to the web app's `POST /api/revalidate` (URL from `WEB_REVALIDATE_URL`) when
        public content changes visibility. Triggers: a post is removed by moderation, deleted, made non-public or
        loses `indexable`; a profile changes visibility or `search_engine_indexing`; a destination or guide is
        unpublished or updated. Delivery is at-least-once with exponential backoff (max 10 attempts over about
        1 h). Receivers must be idempotent on `event_id`. Target propagation is ≤ 10 s. ISR (≤ 60 s) is only a
        fallback.

        **Signature.** `X-TB-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>.<raw body>")>`.
        Receivers reject a stale `t` (more than 300 s skew) or a mismatch (constant-time compare). The secret
        supports two active values during rotation.
      operationId: webCacheRevalidation
      x-phase: 1
      x-requirements: [SAFE-012]
      parameters:
        - name: X-TB-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 300 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, occurred_at, reason, tags]
              properties:
                event_id: { $ref: '#/components/schemas/Uuid' }
                occurred_at: { $ref: '#/components/schemas/Timestamp' }
                reason:
                  type: string
                  enum: [post_removed, post_deleted, post_visibility_changed, post_published, profile_visibility_changed, indexing_consent_changed, destination_changed, guide_changed]
                tags:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: 'Cache tags, e.g. `story:<id>`, `stories`, `profile:<handle>`, `destination:<slug>`, `guide:<id>`, `sitemap`.'
                  items: { type: string, pattern: '^[a-z_]+(:[A-Za-z0-9._-]+)?$', maxLength: 120 }
      responses:
        '204': { description: Revalidated (or already processed). }
        '401': { description: Bad or stale signature. Not retried. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform access token (EdDSA-signed JWT, 15 min) issued by `/v1/auth/login|register|refresh`. Never an IdP token.
    cronSecret:
      type: http
      scheme: bearer
      description: Shared scheduler secret (`CRON_SECRET`). Internal endpoints only.
    pubsubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token attached by Pub/Sub push. Audience = the webhook URL; service account allow-listed.

  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Accepted on every operation. If absent or invalid (not 8–128 chars of `[A-Za-z0-9._-]`), the server generates one. It is always echoed in the response and included in problem bodies.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Selects UI strings and localized destination/place names. User content is always returned in its original language.
      schema: { type: string, maxLength: 200, example: 'pt-BR,pt;q=0.9,en;q=0.8' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Replays with the same key and body return the original response (header `Idempotent-Replayed` = `true`). The same key with a different body returns `409 idempotency_key_reused`. A concurrent duplicate returns `409 idempotency_key_in_progress`. Retained for 24 h (billing 72 h).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The aggregate `version` as a quoted ETag, e.g. `"7"`. A mismatch returns `412 precondition_failed`. A missing header returns `428 precondition_required`.
      schema: { type: string, pattern: '^"\d+"$' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, HMAC-signed, expiring cursor from `page.next_cursor`. Never construct or modify it.
      schema: { type: string, maxLength: 1024 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Near:
      name: near
      in: query
      required: true
      description: '`lat,lng` of the device. Request-scoped only: rounded to 3 decimals, never persisted, and redacted from logs.'
      schema: { $ref: '#/components/schemas/NearParam' }
    NearOptional:
      name: near
      in: query
      required: false
      description: '`lat,lng` of the device. Request-scoped only: rounded to 3 decimals, never persisted, and redacted from logs. Required for `tab=nearby`.'
      schema: { $ref: '#/components/schemas/NearParam' }
    Emoji:
      name: emoji
      in: path
      required: true
      description: A single allow-listed emoji, percent-encoded.
      schema: { type: string, minLength: 1, maxLength: 64 }
    SessionId: { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SelectionId: { name: selectionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DestinationId: { name: destinationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PlaceId: { name: placeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PostId: { name: postId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CommentId: { name: commentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MediaId: { name: mediaId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DeviceTokenId: { name: deviceTokenId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AuditJustification:
      name: X-Audit-Justification
      in: header
      required: true
      description: |
        Why the staff member is performing this action or viewing sensitive data (ADM-009). Stored verbatim
        in `audit_logs.metadata.justification`. Missing or blank → `400 justification_required`.
      schema: { type: string, minLength: 10, maxLength: 500 }
    ConnectionRequestId: { name: connectionRequestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MessageId: { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GroupId: { name: groupId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    JoinRequestId: { name: joinRequestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TransferId: { name: transferId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ChallengeId: { name: challengeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TeamId: { name: teamId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    SubmissionId: { name: submissionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    WinnerId: { name: winnerId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DisputeId: { name: disputeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FulfillmentId: { name: fulfillmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    RewardId: { name: rewardId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GenerationId: { name: generationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TripId: { name: tripId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DayId: { name: dayId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ItemId: { name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    GuideId: { name: guideId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TourId: { name: tourId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PackageId: { name: packageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    LicenseId: { name: licenseId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }

  headers:
    XRequestId:
      description: Correlation ID (echoed or generated).
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string, format: uri-reference }
    ETag:
      description: Aggregate version as a quoted string; send back in `If-Match`.
      schema: { type: string, pattern: '^"\d+"$' }
    IdempotentReplayed:
      description: '`true` when the response is a replay of an earlier identical request.'
      schema: { type: string, enum: ['true'] }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }
    RateLimitLimit:
      description: Requests allowed in the current window for this rate-limit class.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    CacheControlNoStore:
      description: Always `no-store` (sensitive or per-user data).
      schema: { type: string, enum: [no-store] }
    CacheControlPublic:
      description: Short public caching for anonymous content, e.g. `public, max-age=60`.
      schema: { type: string }

  responses:
    JobTick:
      description: Work done by this tick.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobTickResult' }
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: '`validation_failed` — request body/parameters failed validation (see `errors[]`).'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.travelbuddy.example/errors/validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            request_id: 01HZX3R6V8Q3N9K2M7C4B5D6E7
            errors:
              - { field: /name, code: too_short, message: Must be at least 3 characters. }
    Unauthenticated:
      description: '`unauthenticated`, `token_expired`, `token_invalid` or `session_revoked`.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` — authenticated but not permitted. Where existence must not leak, `404` is returned instead.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntitlementRequired:
      description: '`entitlement_required` — the action needs a premium entitlement (for groups: the owner''s). `forbidden` is used for non-entitlement permission failures.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.travelbuddy.example/errors/entitlement_required
            title: Premium membership required
            status: 403
            detail: Creating travel groups requires an active Premium membership.
            code: entitlement_required
            feature_key: groups.create
            request_id: 01HZX3R6V8Q3N9K2M7C4B5D6E7
    NotFound:
      description: '`not_found` — does not exist or is not visible to the caller.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: '`conflict` — the request conflicts with the current state.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: '`idempotency_key_reused` (same key, different body) or `idempotency_key_in_progress`.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: '`precondition_failed` — `If-Match` does not match the current version.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`precondition_required` — `If-Match` header missing.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: '`payload_too_large`.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`unsupported_media_type`.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`rate_limited` — see `Retry-After`.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: '`service_unavailable`, `upstream_unavailable` or `ai_unavailable` — retry with backoff.'
      headers:
        X-Request-ID: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───────── Primitives ─────────
    Uuid: { type: string, format: uuid, description: UUIDv7 (lowercase). }
    Timestamp: { type: string, format: date-time, description: RFC 3339 UTC (Z). }
    NullableTimestamp: { type: [string, 'null'], format: date-time }
    LocalDate: { type: string, format: date, description: 'Calendar date (YYYY-MM-DD) in the destination time zone.' }
    NullableLocalDate: { type: [string, 'null'], format: date }
    LocaleTag: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$', maxLength: 35, example: pt-BR }
    CountryCode: { type: string, pattern: '^[A-Z]{2}$', example: BR }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$', example: BRL }
    TimeZone: { type: string, maxLength: 64, example: America/Sao_Paulo }
    NearParam: { type: string, pattern: '^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$', example: '-22.971,-43.182' }
    GeoPoint:
      type: object
      description: Coordinates of a PUBLIC place or destination centroid. Never used for user positions.
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    InputGeoPoint:
      type: object
      description: Device position submitted for one-time resolution to a destination. Write-only; never stored, logged or echoed.
      writeOnly: true
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0, maximum: 100000 }
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    FeedPageInfo:
      type: object
      required: [next_cursor, has_more, reset]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
        reset:
          type: boolean
          description: True when the ranked snapshot expired and was recomputed. Replace the list instead of appending.
    SeqPageInfo:
      type: object
      required: [has_more, oldest_seq, newest_seq]
      properties:
        has_more: { type: boolean, description: More messages exist in the requested direction. }
        oldest_seq: { type: [integer, 'null'], format: int64 }
        newest_seq: { type: [integer, 'null'], format: int64 }
    QuotaStatus:
      type: object
      required: [limit, used, resets_at]
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        resets_at: { $ref: '#/components/schemas/NullableTimestamp' }

    # ───────── Errors ─────────
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients switch on this, never on `title`. See docs/05 §6.
      x-reserved-codes:
        - csrf_failed
        - network_error
        - feature_not_available_in_mock
      x-reserved-codes-note: Reserved for clients (web BFF, client-side network failures, web mock adapters). Never emitted by the backend.
      enum:
        - bad_request
        - validation_failed
        - invalid_cursor
        - method_not_allowed
        - unauthenticated
        - email_unverified
        - mfa_required
        - reauthentication_required
        - justification_required
        - token_expired
        - token_invalid
        - refresh_token_reused
        - session_revoked
        - forbidden
        - not_found
        - conflict
        - precondition_failed
        - precondition_required
        - idempotency_key_reused
        - idempotency_key_in_progress
        - rate_limited
        - entitlement_required
        - quota_exceeded
        - feature_disabled
        - age_restricted
        - consent_required
        - account_suspended
        - blocked_relationship
        - connection_required
        - connection_request_cooldown
        - connection_request_not_allowed
        - already_connected
        - discovery_disabled
        - location_unresolvable
        - group_capacity_reached
        - owner_must_transfer
        - invitation_invalid
        - invitation_not_allowed
        - member_restricted
        - chat_admins_only
        - message_edit_window_expired
        - challenge_not_active
        - challenge_locked
        - attempts_exhausted
        - attempt_cooldown
        - not_team_captain
        - reward_not_permitted
        - purchase_invalid
        - purchase_already_linked
        - media_not_ready
        - media_rejected
        - payload_too_large
        - unsupported_media_type
        - upstream_unavailable
        - ai_unavailable
        - ai_output_invalid
        - service_unavailable
        - internal_error
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 'JSON Pointer into the body (e.g. `/name`), or `query.<name>` / `header.<name>`.' }
        code: { type: string, description: 'Validator code, e.g. `required`, `too_short`, `invalid_format`, `not_allowed`.' }
        message: { type: string, description: Localized human-readable message. }
    Problem:
      type: object
      description: RFC 9457 problem details with platform extensions.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { $ref: '#/components/schemas/ErrorCode' }
        request_id: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        feature_key:
          type: string
          description: For `entitlement_required` / `quota_exceeded` / `feature_disabled` — the feature, quota or flag key.

    # ───────── Enums ─────────
    ClientPlatform: { type: string, enum: [ios, android, web] }
    PlatformRole: { type: string, enum: [support, moderator, admin, superadmin] }
    PlatformPermission:
      type: string
      description: |
        Platform RBAC permission (staff only). Mirrors `backend/app/core/security/principal.py::Permission`
        exactly (a contract test enforces this). Role → permission mapping is cumulative:
        support ⊂ moderator ⊂ admin ⊂ superadmin. Admin operations name their permission in `x-platform-permission`.
      enum:
        - users.read
        - users.read_sensitive
        - users.suspend
        - users.ban
        - moderation.reports.read
        - moderation.reports.manage
        - moderation.actions.read
        - moderation.actions.write
        - content.destinations.write
        - content.feature
        - content.rewards.review
        - entitlements.grant
        - billing.configure
        - audit.read
        - roles.assign
    TravelStyle: { type: string, enum: [adventure, backpacking, luxury, food, culture, photography, digital_nomad, nature, family] }
    DestinationKind: { type: string, enum: [country, admin_region, city, district, neighborhood, area] }
    PlaceCategory: { type: string, enum: [attraction, restaurant, cafe, bar, museum, beach, trail, viewpoint, park, market, lodging, transit_hub, other] }
    PostKind: { type: string, enum: [text, photo, video, story, attraction_recommendation, restaurant_recommendation, review, tip, itinerary_summary, experience] }
    PostVisibility: { type: string, enum: [public, followers, connections, private] }
    LocationPrecision: { type: string, enum: [none, destination, place] }
    PostModerationState: { type: string, enum: [pending, approved, limited, removed] }
    ReactionType: { type: string, enum: [like, love, helpful, wow] }
    FeedTab: { type: string, enum: [for_you, nearby, following, destinations], default: for_you }
    FeedSource: { type: string, enum: [gps, selected, upcoming_trip, interests, global, following] }
    RelationshipState: { type: string, enum: [none, request_pending, request_received, connected, declined, blocked] }
    ConnectionRequestStatus: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
    ConnectionContext: { type: string, enum: [discovery, group, profile, post] }
    ConversationKind: { type: string, enum: [direct, group, challenge_team] }
    MessageKind: { type: string, enum: [text, image, system, announcement] }
    NotificationLevel: { type: string, enum: [all, mentions, none] }
    GroupVisibility: { type: string, enum: [private, unlisted, public] }
    GroupJoinPolicy: { type: string, enum: [invite_only, request_to_join] }
    GroupRoleKey: { type: string, enum: [owner, admin, moderator, member] }
    GroupMembershipStatus: { type: string, enum: [active, restricted, removed, left] }
    GroupPermission:
      type: string
      enum: [group.edit, group.delete, group.transfer, members.invite, members.approve, members.remove, members.restrict, roles.assign, messages.remove, messages.pin, announcements.post, challenges.manage, challenges.judge]
    GroupInvitationStatus: { type: string, enum: [active, exhausted, revoked, expired, accepted, declined] }
    ChallengeStatus: { type: string, enum: [draft, scheduled, active, judging, completed, cancelled] }
    SolvingMode: { type: string, enum: [individual, team] }
    ValidationMethod: { type: string, enum: [exact, admin_review, ai_assisted] }
    WinnerPolicy: { type: string, enum: [first_correct, first_n_correct, all_correct, admin_selects] }
    SubmissionEvaluationStatus: { type: string, enum: [pending, correct, incorrect, needs_review, void] }
    RewardType: { type: string, enum: [badge, achievement, discount_code, promotional] }
    FulfillmentStatus: { type: string, enum: [pending, issued, delivered, failed, cancelled, disputed] }
    TripStatus: { type: string, enum: [planning, active, completed, archived] }
    TripVisibility: { type: string, enum: [private, connections, group, public] }
    ItineraryItemKind: { type: string, enum: [activity, meal, transit, lodging, note, free_time] }
    ContentTier: { type: string, enum: [free, premium, purchasable] }
    OfflinePackageKind: { type: string, enum: [guide, audio_tour, map_region, bundle] }
    ProductPlatform: { type: string, enum: [ios, android, web] }
    BillingProvider: { type: string, enum: [apple, google, stripe] }
    ReportTargetType: { type: string, enum: [post, comment, user, message, group, challenge, media] }
    ReportReason: { type: string, enum: [spam, harassment, hate, sexual_content, minor_safety, violence, self_harm, scam, privacy_violation, impersonation, illegal, other] }
    ReportStatus: { type: string, enum: [open, in_review, actioned, dismissed] }
    ModerationActionType: { type: string, enum: [remove_content, restore_content, limit_visibility, warn, restrict, suspend, ban, reinstate, remove_member] }
    ConsentType: { type: string, enum: [terms, privacy_policy, location, traveler_discovery, marketing, ai_personalization, post_translation, search_indexing] }
    MediaPurpose: { type: string, enum: [post, avatar, message, group_cover, challenge] }
    MediaStatus: { type: string, enum: [pending_upload, scanning, ready, rejected, deleted] }
    NotificationType:
      type: string
      enum: [connection_request, connection_accepted, new_message, group_invitation, group_announcement, challenge_started, challenge_result, post_reaction, post_comment, new_follower, follow_request, moderation_notice, subscription_notice, ai_generation_ready, data_export_ready]

    # ───────── Health & config ─────────
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    JobTickResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [relayed, succeeded, retried, dead, recovered]
          properties:
            relayed: { type: integer, minimum: 0, description: Outbox events turned into jobs. }
            succeeded: { type: integer, minimum: 0 }
            retried: { type: integer, minimum: 0, description: Failed and rescheduled with backoff. }
            dead: { type: integer, minimum: 0, description: Failed permanently or out of attempts. }
            recovered: { type: integer, minimum: 0, description: Abandoned by a crashed worker and re-queued. }
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          description: One entry per critical dependency (e.g. `database`, `redis`).
          additionalProperties: { type: string, enum: [ok, fail] }
    ClientConfig:
      type: object
      required: [min_supported_version, update_required, supported_locales, default_locale, feature_flags, legal, minimum_age]
      properties:
        min_supported_version: { type: string }
        latest_version: { type: string }
        update_required: { type: boolean }
        supported_locales: { type: array, items: { $ref: '#/components/schemas/LocaleTag' } }
        default_locale: { $ref: '#/components/schemas/LocaleTag' }
        feature_flags:
          type: object
          description: |
            Client-relevant feature flags, keyed by the backend `Flag` names (`backend/app/core/feature_flags.py`).
            Global values (no per-user targeting yet). They are for UI only: disabled routes still answer
            `403 feature_disabled`. Internal-only flags are omitted.
          additionalProperties: { type: boolean }
          example: { traveler_discovery: false, travel_groups: false, ai_itineraries: false, post_translation: false }
        web_push_vapid_public_key:
          type: [string, 'null']
          description: Base64url VAPID application server key for Web Push subscriptions (NOTIF-005). Null when Web Push is disabled. Rotations are announced here.
        legal:
          type: object
          required: [terms_version, privacy_version, terms_url, privacy_url]
          properties:
            terms_version: { type: string }
            privacy_version: { type: string }
            terms_url: { type: string, format: uri }
            privacy_url: { type: string, format: uri }
            community_guidelines_url: { type: string, format: uri }
            safety_tips_url: { type: string, format: uri }
        minimum_age: { type: integer, minimum: 13, example: 18 }
    TravelInterestCatalog:
      type: object
      required: [travel_styles, interests]
      properties:
        travel_styles:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { $ref: '#/components/schemas/TravelStyle' }
              label: { type: string }
        interests:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string, maxLength: 40 }
              label: { type: string }
              group: { type: string }

    # ───────── Auth & identity ─────────
    DeviceInfo:
      type: object
      additionalProperties: false
      description: Optional device metadata for session lists. The web BFF may omit it; the server then derives a display name from the User-Agent (e.g. "Chrome on macOS").
      required: [device_id]
      properties:
        device_id: { type: string, minLength: 8, maxLength: 128, description: App-generated install ID. }
        device_name: { type: string, maxLength: 80 }
        app_version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
    RegisterRequest:
      type: object
      additionalProperties: false
      description: There is no `provider` field. The backend selects the OIDC verifier from the token's `iss`.
      required: [id_token, client, birth_date, accepted_terms_version, accepted_privacy_version, locale]
      properties:
        id_token: { type: string, minLength: 20, maxLength: 8192, description: OIDC ID token from the identity provider (or the dev IdP in development/test). }
        client: { $ref: '#/components/schemas/ClientPlatform' }
        nonce: { type: string, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        birth_date:
          type: string
          format: date
          writeOnly: true
          description: Used transiently for the age gate only. Only the birth year is persisted.
        accepted_terms_version: { type: string, maxLength: 32 }
        accepted_privacy_version: { type: string, maxLength: 32 }
        locale: { $ref: '#/components/schemas/LocaleTag' }
    LoginRequest:
      type: object
      additionalProperties: false
      description: There is no `provider` field. The backend selects the OIDC verifier from the token's `iss`.
      required: [id_token, client]
      properties:
        id_token: { type: string, minLength: 20, maxLength: 8192 }
        client: { $ref: '#/components/schemas/ClientPlatform' }
        nonce: { type: string, maxLength: 128 }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 32, maxLength: 512 }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        all_sessions: { type: boolean, default: false }
    SessionTokens:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, session_id]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        access_token_expires_at: { $ref: '#/components/schemas/Timestamp' }
        refresh_token: { type: string }
        refresh_token_expires_at: { $ref: '#/components/schemas/Timestamp' }
        session_id: { $ref: '#/components/schemas/Uuid' }
    AuthResult:
      type: object
      required: [tokens, user, is_new_user]
      properties:
        tokens: { $ref: '#/components/schemas/SessionTokens' }
        user: { $ref: '#/components/schemas/Me' }
        is_new_user: { type: boolean }
    Session:
      type: object
      description: A platform session. Never includes IP addresses or tokens.
      required: [id, platform, device_name, created_at, last_used_at, is_current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        device_name: { type: [string, 'null'], example: Chrome on macOS }
        app_version: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { $ref: '#/components/schemas/Timestamp' }
        is_current: { type: boolean }
    SessionList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Session' } }
    DevIdpTokenRequest:
      type: object
      additionalProperties: false
      description: DEVELOPMENT ONLY.
      required: [sub, email]
      properties:
        sub: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 254 }
        email_verified: { type: boolean, default: true }
        name: { type: string, maxLength: 100 }
        nonce: { type: string, maxLength: 128, description: 'Copied into the `nonce` claim when supplied.' }
        mfa: { type: boolean, default: false, description: 'Simulates a completed second factor: `amr` becomes `["dev", "mfa"]`. Staff permissions require it (ADM-007).' }
    DevIdpToken:
      type: object
      required: [id_token, expires_at]
      properties:
        id_token: { type: string }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, kid, alg, use]
            properties:
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              x: { type: string, description: base64url public key }
              kid: { type: string, example: dev-1 }
              alg: { type: string, const: EdDSA }
              use: { type: string, const: sig }
    RealtimeTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: '256-bit random value, base64url without padding. Single use.' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    # ───────── Me / profiles ─────────
    Me:
      type: object
      description: Bootstrap object for the authenticated user.
      required: [account, profile, preferences, privacy, roles, onboarding_completed, browse_destination, entitlements]
      properties:
        account: { $ref: '#/components/schemas/MyAccount' }
        profile: { $ref: '#/components/schemas/MyProfile' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        privacy: { $ref: '#/components/schemas/PrivacySettings' }
        roles: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }
        permissions:
          type: array
          description: Effective platform permissions (empty for non-staff). For UI only; every admin call is re-authorized server-side.
          items: { $ref: '#/components/schemas/PlatformPermission' }
        onboarding_completed: { type: boolean }
        browse_destination:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        entitlements: { $ref: '#/components/schemas/Entitlements' }
    MyAccount:
      type: object
      required: [id, email, email_verified, status, primary_locale, age_assured, deletion_scheduled_for, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: [string, 'null'], format: email }
        email_verified: { type: boolean }
        status: { type: string, enum: [active, pending_deletion] }
        primary_locale: { $ref: '#/components/schemas/LocaleTag' }
        age_assured: { type: boolean }
        deletion_scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        restrictions:
          type: array
          description: |
            Active moderation restrictions on *my* account, for UI messaging (SAFE-013). Shown only to the
            account holder. A fully suspended account cannot obtain a session, so `suspended` appears only
            on the sign-in error and not here.
          items: { $ref: '#/components/schemas/AccountRestriction' }
    AccountRestriction:
      type: object
      additionalProperties: false
      required: [kind, reason_code, until, appealable]
      properties:
        kind:
          type: string
          enum: [posting_limited, commenting_limited, messaging_limited, connection_requests_limited, discovery_disabled, media_upload_limited]
        reason_code:
          type: string
          description: Moderation reason code (e.g. `spam`, `harassment`), localized for display by the client.
          maxLength: 64
        until: { $ref: '#/components/schemas/NullableTimestamp' }
        appealable: { type: boolean }
    MyProfile:
      type: object
      required: [id, handle, display_name, bio, avatar, home_country_code, home_region, travel_styles, interests, languages_spoken, account_visibility, counts, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
        display_name: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatar:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        home_country_code: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        home_region: { type: [string, 'null'], maxLength: 100 }
        travel_styles: { type: array, items: { $ref: '#/components/schemas/TravelStyle' } }
        interests: { type: array, items: { type: string, maxLength: 40 } }
        languages_spoken: { type: array, items: { $ref: '#/components/schemas/LocaleTag' } }
        account_visibility: { type: string, enum: [public, private] }
        counts: { $ref: '#/components/schemas/ProfileCounts' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ProfileCounts:
      type: object
      required: [posts, followers, following]
      properties:
        posts: { type: integer, minimum: 0 }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        handle: { type: string, pattern: '^[a-z0-9_.]{3,30}$' }
        display_name: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: [string, 'null'], maxLength: 300 }
        avatar_media_id: { type: [string, 'null'], format: uuid }
        home_country_code: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        home_region: { type: [string, 'null'], maxLength: 100 }
        travel_styles: { type: array, maxItems: 9, uniqueItems: true, items: { $ref: '#/components/schemas/TravelStyle' } }
        interests: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 40 } }
        languages_spoken: { type: array, maxItems: 10, uniqueItems: true, items: { $ref: '#/components/schemas/LocaleTag' } }
        account_visibility: { type: string, enum: [public, private] }
    NotificationChannelSettings:
      type: object
      additionalProperties: false
      properties:
        push: { type: boolean }
        in_app: { type: boolean }
        email: { type: boolean }
    Preferences:
      type: object
      required: [ui_locale, content_languages, time_zone, currency_code, distance_unit, auto_translate, notification_settings]
      properties:
        ui_locale: { $ref: '#/components/schemas/LocaleTag' }
        content_languages: { type: array, items: { $ref: '#/components/schemas/LocaleTag' }, description: Empty = all languages. }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        currency_code: { $ref: '#/components/schemas/CurrencyCode' }
        distance_unit: { type: string, enum: [km, mi] }
        auto_translate: { type: boolean }
        notification_settings:
          type: object
          propertyNames: { $ref: '#/components/schemas/NotificationType' }
          additionalProperties: { $ref: '#/components/schemas/NotificationChannelSettings' }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ui_locale: { $ref: '#/components/schemas/LocaleTag' }
        content_languages: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/LocaleTag' } }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        currency_code: { $ref: '#/components/schemas/CurrencyCode' }
        distance_unit: { type: string, enum: [km, mi] }
        auto_translate: { type: boolean }
        notification_settings:
          type: object
          propertyNames: { $ref: '#/components/schemas/NotificationType' }
          additionalProperties: { $ref: '#/components/schemas/NotificationChannelSettings' }
    ConsentState:
      type: object
      required: [version, granted_at]
      properties:
        version: { type: string }
        granted_at: { $ref: '#/components/schemas/Timestamp' }
    PrivacySettings:
      type: object
      required: [discovery_enabled, discovery_granularity, connection_requests_from, profile_visibility, show_trips_on_profile, read_receipts_enabled, post_location_default, location_consent, discovery_consent]
      properties:
        discovery_enabled: { type: boolean, description: Opt-in; default false. }
        discovery_granularity: { type: string, enum: [city, neighborhood] }
        connection_requests_from: { type: string, enum: [everyone, shared_context, nobody] }
        profile_visibility: { type: string, enum: [public, connections] }
        show_trips_on_profile: { type: boolean }
        read_receipts_enabled: { type: boolean, description: Reciprocal. }
        post_location_default: { $ref: '#/components/schemas/LocationPrecision' }
        search_engine_indexing:
          type: boolean
          default: false
          description: |
            Opt-in (default false; PROF-008). When false, the public profile and public posts are served with
            `indexable: false` (clients emit `noindex`) and are excluded from sitemaps. Toggling it records a
            `search_indexing` consent and triggers web cache revalidation.
        location_consent:
          anyOf:
            - { $ref: '#/components/schemas/ConsentState' }
            - { type: 'null' }
        discovery_consent:
          anyOf:
            - { $ref: '#/components/schemas/ConsentState' }
            - { type: 'null' }
    UpdatePrivacySettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        discovery_enabled: { type: boolean }
        discovery_granularity: { type: string, enum: [city, neighborhood] }
        connection_requests_from: { type: string, enum: [everyone, shared_context, nobody] }
        profile_visibility: { type: string, enum: [public, connections] }
        show_trips_on_profile: { type: boolean }
        read_receipts_enabled: { type: boolean }
        post_location_default: { $ref: '#/components/schemas/LocationPrecision' }
        search_engine_indexing: { type: boolean }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [consent_type, version, granted, source]
      properties:
        consent_type: { $ref: '#/components/schemas/ConsentType' }
        version: { type: string, maxLength: 32 }
        granted: { type: boolean }
        source: { type: string, enum: [onboarding, settings, prompt] }
    ConsentRecord:
      type: object
      required: [consent_type, version, granted, source, recorded_at]
      properties:
        consent_type: { $ref: '#/components/schemas/ConsentType' }
        version: { type: string }
        granted: { type: boolean }
        source: { type: string, enum: [onboarding, settings, prompt] }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: boolean, const: true }
        reason: { type: string, maxLength: 500 }
    DataSubjectRequest:
      type: object
      required: [id, kind, status, requested_at, completed_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [export, deletion, rectification] }
        status: { type: string, enum: [received, processing, completed, rejected, cancelled] }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        scheduled_for: { $ref: '#/components/schemas/NullableTimestamp' }
        download:
          anyOf:
            - type: object
              required: [url, expires_at]
              properties:
                url: { type: string, format: uri }
                expires_at: { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
    DataSubjectRequestPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DataSubjectRequest' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    UserSummary:
      type: object
      description: Minimal public identity of another user.
      required: [id, handle, display_name, avatar]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { type: string }
        display_name: { type: string }
        avatar:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
    UserSummaryPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    BadgeSummary:
      type: object
      required: [id, key, name, icon]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        key: { type: string }
        name: { type: string }
        icon:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
    PublicProfile:
      type: object
      description: Another user's profile as seen by the viewer. Never contains email, birth data, coordinates, distance, last-seen or session data.
      additionalProperties: false
      required: [id, handle, display_name, avatar, bio, home_country_code, travel_styles, interests, languages_spoken, account_visibility, is_restricted, counts, badges, relationship, follow_status, can_request_connection, can_message]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { type: string }
        display_name: { type: string }
        avatar:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        bio: { type: [string, 'null'] }
        home_country_code: { type: [string, 'null'], description: Null when hidden by privacy settings. }
        travel_styles: { type: array, items: { $ref: '#/components/schemas/TravelStyle' } }
        interests: { type: array, items: { type: string } }
        languages_spoken: { type: array, items: { $ref: '#/components/schemas/LocaleTag' } }
        account_visibility: { type: string, enum: [public, private] }
        is_restricted: { type: boolean, description: 'True when details are withheld (private account, or `profile_visibility = connections` and not connected).' }
        indexable: { type: boolean, description: 'True only for public profiles whose owner opted into `search_engine_indexing` (PROF-008). Absent or false means `noindex`.' }
        counts:
          anyOf:
            - { $ref: '#/components/schemas/ProfileCounts' }
            - { type: 'null' }
        badges: { type: array, items: { $ref: '#/components/schemas/BadgeSummary' } }
        relationship: { $ref: '#/components/schemas/RelationshipState' }
        follow_status: { type: string, enum: [none, following, requested] }
        can_request_connection: { type: boolean }
        can_message: { type: boolean }
    UserBadge:
      type: object
      required: [badge, awarded_at, source_type, source_id]
      properties:
        badge: { $ref: '#/components/schemas/BadgeSummary' }
        awarded_at: { $ref: '#/components/schemas/Timestamp' }
        source_type: { type: string, enum: [challenge, platform] }
        source_id: { type: [string, 'null'], format: uuid }

    # ───────── Destinations & places ─────────
    DestinationSummary:
      type: object
      required: [id, kind, slug, path, name, country_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/DestinationKind' }
        slug: { type: string, example: rio-de-janeiro-br, description: Globally unique slug. }
        path: { type: string, example: brazil/rio-de-janeiro, description: 'Language-neutral slug path for `GET /v1/destinations/lookup` and SEO URLs.' }
        name: { type: string, description: Localized via Accept-Language. }
        country_code: { $ref: '#/components/schemas/CountryCode' }
        country_name: { type: [string, 'null'], description: 'Localized country name (null for `kind=country`, where it equals `name`).' }
        continent: { $ref: '#/components/schemas/Continent' }
        tagline: { type: [string, 'null'], maxLength: 140, description: Localized editorial one-liner for directory cards. }
        cover:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
    Continent:
      type: string
      description: Directory region used for browsing filters (editorial grouping, not a political classification).
      enum: [africa, asia, europe, middle_east, north_america, central_america_caribbean, south_america, oceania]
    DestinationSummaryPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DestinationSummary' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Destination:
      allOf:
        - { $ref: '#/components/schemas/DestinationSummary' }
        - type: object
          required: [parent_id, ancestors, centroid, time_zone, is_featured, has_children, has_guides]
          properties:
            parent_id: { type: [string, 'null'], format: uuid }
            ancestors:
              type: array
              description: Root (country) first, excluding self.
              items: { $ref: '#/components/schemas/DestinationSummary' }
            centroid: { $ref: '#/components/schemas/GeoPoint' }
            time_zone: { $ref: '#/components/schemas/TimeZone' }
            is_featured: { type: boolean }
            has_children: { type: boolean }
            has_guides: { type: boolean }
    BrowseDestination:
      type: object
      required: [destination, selected_at]
      properties:
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        selected_at: { $ref: '#/components/schemas/Timestamp' }
    UpcomingDestination:
      type: object
      required: [id, destination, start_date, end_date, share_for_discovery, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        share_for_discovery: { type: boolean, description: 'Opt-in: lets other opted-in travelers find me under `scope=upcoming` for this destination.' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CreateUpcomingDestinationRequest:
      type: object
      additionalProperties: false
      required: [destination_id]
      properties:
        destination_id: { $ref: '#/components/schemas/Uuid' }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        share_for_discovery: { type: boolean, default: false }
    DiscoverySession:
      type: object
      description: Contains resolved destinations only — never coordinates.
      required: [id, destination, area, granularity, source, visibility, travel_start_date, travel_end_date, started_at, expires_at]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        area:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        granularity: { type: string, enum: [city, neighborhood] }
        source: { type: string, enum: [gps_resolved, manual] }
        visibility: { type: string, enum: [visible, invisible] }
        travel_start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        travel_end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    SetDiscoverySessionRequest:
      oneOf:
        - { $ref: '#/components/schemas/DiscoveryByDestinationRequest' }
        - { $ref: '#/components/schemas/DiscoveryByGpsRequest' }
      discriminator:
        propertyName: mode
        mapping:
          destination: '#/components/schemas/DiscoveryByDestinationRequest'
          gps: '#/components/schemas/DiscoveryByGpsRequest'
    DiscoveryByDestinationRequest:
      type: object
      additionalProperties: false
      required: [mode, destination_id]
      properties:
        mode: { type: string, const: destination }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        area_destination_id: { $ref: '#/components/schemas/Uuid' }
        duration_hours: { type: integer, minimum: 1, maximum: 72, default: 24 }
        visibility: { type: string, enum: [visible, invisible], default: visible }
        travel_start_date: { $ref: '#/components/schemas/LocalDate' }
        travel_end_date: { $ref: '#/components/schemas/LocalDate' }
    DiscoveryByGpsRequest:
      type: object
      additionalProperties: false
      required: [mode, point]
      properties:
        mode: { type: string, const: gps }
        point: { $ref: '#/components/schemas/InputGeoPoint' }
        duration_hours: { type: integer, minimum: 1, maximum: 72, default: 24 }
        visibility: { type: string, enum: [visible, invisible], default: visible }
        travel_start_date: { $ref: '#/components/schemas/LocalDate' }
        travel_end_date: { $ref: '#/components/schemas/LocalDate' }
    PlaceAttribution:
      type: object
      required: [provider, license, text]
      properties:
        provider: { type: string }
        license: { type: string }
        text: { type: string }
        url: { type: [string, 'null'], format: uri }
    PlaceSummary:
      type: object
      required: [id, name, category, destination_id, location]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        category: { $ref: '#/components/schemas/PlaceCategory' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        location: { $ref: '#/components/schemas/GeoPoint' }
    Place:
      allOf:
        - { $ref: '#/components/schemas/PlaceSummary' }
        - type: object
          required: [address, attributes, data_freshness_at, attribution, status]
          properties:
            address:
              type: [object, 'null']
              properties:
                line1: { type: string }
                locality: { type: string }
                region: { type: string }
                postal_code: { type: string }
                country_code: { $ref: '#/components/schemas/CountryCode' }
            attributes:
              type: object
              description: Licensed provider data (e.g. opening hours, website, phone), always shown with `data_freshness_at`. Never AI-generated.
              additionalProperties: true
            data_freshness_at: { $ref: '#/components/schemas/Timestamp' }
            attribution: { $ref: '#/components/schemas/PlaceAttribution' }
            status: { type: string, enum: [active, closed_permanently] }
    PlacePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PlaceSummary' } }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ───────── Media ─────────
    MediaRef:
      type: object
      description: A renderable media reference. Private media URLs are short-lived signed URLs issued after per-request authorization.
      required: [id, kind, status, url, url_expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [image, video, audio] }
        status: { type: string, enum: [ready, processing, unavailable] }
        url: { type: [string, 'null'], format: uri }
        url_expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        alt_text: { type: [string, 'null'], maxLength: 300 }
        blurhash: { type: [string, 'null'], maxLength: 100 }
        attribution:
          description: |
            Credit for editorial or licensed media (destination covers, guide and audio-tour imagery). Clients must
            display it wherever the media is shown. Null for user-generated media, which is credited via its author.
            Rights are verified server-side before editorial media can be published (DEST-007).
          anyOf:
            - type: object
              additionalProperties: false
              required: [text, license]
              properties:
                text: { type: string, maxLength: 300, example: Photo by Ana Souza }
                license: { type: string, maxLength: 100, example: CC BY-SA 4.0 }
                url: { type: [string, 'null'], format: uri, description: Source or license URL. }
            - { type: 'null' }
        variants:
          type: object
          additionalProperties: { type: string, format: uri }
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, mime_type, bytes, sha256]
      properties:
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, video/mp4, video/quicktime] }
        bytes: { type: integer, minimum: 1, maximum: 524288000 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        width: { type: integer, minimum: 1, maximum: 20000 }
        height: { type: integer, minimum: 1, maximum: 20000 }
        duration_ms: { type: integer, minimum: 1, maximum: 180000 }
        alt_text: { type: string, maxLength: 300 }
    MediaUpload:
      type: object
      required: [media_id, upload, max_bytes]
      properties:
        media_id: { $ref: '#/components/schemas/Uuid' }
        upload:
          type: object
          required: [method, url, headers, expires_at]
          properties:
            method: { type: string, const: PUT }
            url: { type: string, format: uri }
            headers:
              type: object
              additionalProperties: { type: string }
            expires_at: { $ref: '#/components/schemas/Timestamp' }
        max_bytes: { type: integer }
    MediaAsset:
      type: object
      required: [id, purpose, status, mime_type, bytes, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        status: { $ref: '#/components/schemas/MediaStatus' }
        mime_type: { type: string }
        bytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        rejection_reason: { type: [string, 'null'], enum: [malware, policy_violation, type_mismatch, hash_mismatch, too_large, processing_failed, null] }
        ref:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ───────── Feed & posts ─────────
    FeedContext:
      type: object
      description: Explains which step of the PRD FEED-001 fallback chain produced the feed.
      required: [destination, source, radius_km]
      additionalProperties: false
      properties:
        destination:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        source: { $ref: '#/components/schemas/FeedSource' }
        radius_km: { type: [number, 'null'] }
    FeedPage:
      type: object
      required: [data, page, context]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        page: { $ref: '#/components/schemas/FeedPageInfo' }
        context: { $ref: '#/components/schemas/FeedContext' }
    FeedFeedbackRequest:
      type: object
      additionalProperties: false
      required: [post_id, kind]
      properties:
        post_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [hide, not_interested, see_less_author] }
    PostCounts:
      type: object
      required: [reactions, comments, bookmarks, shares, reactions_by_type]
      properties:
        reactions: { type: integer, minimum: 0 }
        comments: { type: integer, minimum: 0 }
        bookmarks: { type: integer, minimum: 0 }
        shares: { type: integer, minimum: 0 }
        reactions_by_type:
          type: object
          propertyNames: { $ref: '#/components/schemas/ReactionType' }
          additionalProperties: { type: integer, minimum: 0 }
    PostViewerState:
      type: object
      required: [reaction, bookmarked, is_author, can_edit, can_delete, can_comment]
      properties:
        reaction:
          anyOf:
            - { $ref: '#/components/schemas/ReactionType' }
            - { type: 'null' }
        bookmarked: { type: boolean }
        is_author: { type: boolean }
        can_edit: { type: boolean }
        can_delete: { type: boolean }
        can_comment: { type: boolean }
    PostCore:
      type: object
      description: Fields shared by `Post` and `PublicPost`.
      required: [id, author, kind, body, language, visibility, location_precision, primary_destination, place, travel_date, rating, tags, media, published_at, edited_at, counts]
      properties:
        indexable:
          type: boolean
          description: True only when the post is public and approved, and its author opted into `search_engine_indexing` (PROF-008). Absent or false means clients must emit `noindex` and leave it out of sitemaps.
        id: { $ref: '#/components/schemas/Uuid' }
        author: { $ref: '#/components/schemas/UserSummary' }
        kind: { $ref: '#/components/schemas/PostKind' }
        body: { type: string, maxLength: 5000 }
        language: { $ref: '#/components/schemas/LocaleTag' }
        visibility: { $ref: '#/components/schemas/PostVisibility' }
        location_precision: { $ref: '#/components/schemas/LocationPrecision' }
        primary_destination:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        place:
          anyOf:
            - { $ref: '#/components/schemas/PlaceSummary' }
            - { type: 'null' }
        travel_date: { $ref: '#/components/schemas/NullableLocalDate' }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        trip_id: { type: [string, 'null'], format: uuid }
        tags: { type: array, items: { type: string, maxLength: 40 } }
        media: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        edited_at: { $ref: '#/components/schemas/NullableTimestamp' }
        counts: { $ref: '#/components/schemas/PostCounts' }
    Post:
      description: A post as seen by an authenticated viewer.
      allOf:
        - { $ref: '#/components/schemas/PostCore' }
        - type: object
          required: [viewer]
          properties:
            viewer: { $ref: '#/components/schemas/PostViewerState' }
            moderation_state:
              description: Present only when the viewer is the author.
              $ref: '#/components/schemas/PostModerationState'
    PublicPost:
      description: A public, moderation-approved post for anonymous guests. No viewer-specific fields.
      allOf:
        - { $ref: '#/components/schemas/PostCore' }
    PostPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Post' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    PublicPostPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PublicPost' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreatePostRequest:
      type: object
      additionalProperties: false
      description: |
        `rating` only for `kind = review`. With `location_precision = none`, `destination_id` and `place_id`
        must be omitted. With `place`, `place_id` is required and the destination is derived. With
        `destination`, `destination_id` is required. `body` may be empty only when media are attached.
        `attraction_recommendation`, `restaurant_recommendation` and `review` need a location
        (`location_precision` other than `none`); `photo`, `video` and `story` need at least one media item;
        `itinerary_summary` needs `trip_id`. Violations fail with `422` and the offending field in `errors[]`.
      required: [kind, body, visibility, location_precision]
      properties:
        kind: { $ref: '#/components/schemas/PostKind' }
        body: { type: string, maxLength: 5000 }
        language: { $ref: '#/components/schemas/LocaleTag' }
        visibility: { $ref: '#/components/schemas/PostVisibility' }
        media_ids: { type: array, maxItems: 10, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        location_precision: { $ref: '#/components/schemas/LocationPrecision' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        place_id: { $ref: '#/components/schemas/Uuid' }
        travel_date: { $ref: '#/components/schemas/LocalDate' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        trip_id: { $ref: '#/components/schemas/Uuid' }
        tags: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 40 } }
    UpdatePostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        body: { type: string, maxLength: 5000 }
        visibility: { $ref: '#/components/schemas/PostVisibility' }
        location_precision: { $ref: '#/components/schemas/LocationPrecision' }
        destination_id: { type: [string, 'null'], format: uuid }
        place_id: { type: [string, 'null'], format: uuid }
        travel_date: { $ref: '#/components/schemas/NullableLocalDate' }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        tags: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 40 } }
    ReactionResult:
      type: object
      required: [reaction, counts]
      properties:
        reaction: { $ref: '#/components/schemas/ReactionType' }
        counts: { $ref: '#/components/schemas/PostCounts' }
    Reaction:
      type: object
      required: [user, reaction, created_at]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        reaction: { $ref: '#/components/schemas/ReactionType' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ReactionPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Reaction' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Comment:
      type: object
      required: [id, post_id, parent_comment_id, author, body, language, reply_count, deleted, created_at, edited_at, viewer]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        post_id: { $ref: '#/components/schemas/Uuid' }
        parent_comment_id: { type: [string, 'null'], format: uuid }
        author:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        body: { type: [string, 'null'], maxLength: 2000, description: Null when deleted (tombstone). }
        language: { $ref: '#/components/schemas/LocaleTag' }
        reply_count: { type: integer, minimum: 0 }
        deleted: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        edited_at: { $ref: '#/components/schemas/NullableTimestamp' }
        viewer:
          type: object
          required: [can_edit, can_delete]
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
    CommentPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        parent_comment_id: { $ref: '#/components/schemas/Uuid' }
    ShareLink:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Translation:
      type: object
      required: [post_id, source_language, target_language, text, machine_translated]
      properties:
        post_id: { $ref: '#/components/schemas/Uuid' }
        source_language: { $ref: '#/components/schemas/LocaleTag' }
        target_language: { $ref: '#/components/schemas/LocaleTag' }
        text: { type: string }
        machine_translated: { type: boolean, const: true }
        provider_attribution: { type: [string, 'null'] }
    FollowState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [following, requested] }

    # ───────── Safety ─────────
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { $ref: '#/components/schemas/Uuid' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: string, maxLength: 1000 }
        also_block: { type: boolean, default: false, description: 'For user-attributable targets, also block the author in the same request.' }
    ReportReceipt:
      type: object
      required: [id, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ───────── Notifications ─────────
    Notification:
      type: object
      required: [id, type, actor, entity_type, entity_id, title, body, data, read_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/NotificationType' }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        entity_type: { type: [string, 'null'] }
        entity_id: { type: [string, 'null'], format: uuid }
        title: { type: string, description: Localized. }
        body: { type: string, description: Localized. Never contains private message bodies. }
        data: { type: object, additionalProperties: true }
        read_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    NotificationPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    MarkNotificationsReadRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ids]
          properties:
            ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } }
        - type: object
          additionalProperties: false
          required: [all]
          properties:
            all: { type: boolean, const: true }
    RegisterPushDeviceRequest:
      description: |
        One registry for native push tokens and browser Web Push subscriptions (NOTIF-002, NOTIF-005). Registration
        is scoped to the current session; revoking the session deletes it. Web Push endpoints are capability URLs:
        the server stores them encrypted and never logs or returns them.
      oneOf:
        - type: object
          additionalProperties: false
          required: [provider, token, device_id]
          properties:
            provider: { type: string, enum: [expo, fcm, apns] }
            token: { type: string, minLength: 8, maxLength: 4096 }
            device_id: { type: string, minLength: 8, maxLength: 128 }
        - type: object
          additionalProperties: false
          required: [provider, subscription, device_id]
          properties:
            provider: { type: string, const: webpush }
            device_id: { type: string, minLength: 8, maxLength: 128, description: Browser install ID generated by the web client. }
            subscription:
              type: object
              additionalProperties: false
              description: The browser `PushSubscription.toJSON()` output.
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
                expiration_time: { type: [integer, 'null'], description: 'Epoch milliseconds, as reported by the browser.' }
                keys:
                  type: object
                  additionalProperties: false
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, minLength: 16, maxLength: 256 }
                    auth: { type: string, minLength: 8, maxLength: 64 }
    PushDevice:
      type: object
      required: [id, provider, device_id, created_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { type: string, enum: [expo, fcm, apns, webpush] }
        device_id: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }

    # ───────── Discovery & connections ─────────
    TravelerPresence:
      type: object
      description: Coarse presence only. No coordinates, distances or timestamps of activity.
      additionalProperties: false
      required: [kind, destination, area, travel_start_date, travel_end_date]
      properties:
        kind: { type: string, enum: [here_now, upcoming] }
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        area:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        travel_start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        travel_end_date: { $ref: '#/components/schemas/NullableLocalDate' }
    TravelerCard:
      type: object
      additionalProperties: false
      required: [user, bio_snippet, travel_styles, interests, languages_spoken, presence, shared, compatibility, relationship, can_request_connection]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        bio_snippet: { type: [string, 'null'], maxLength: 140 }
        travel_styles: { type: array, items: { $ref: '#/components/schemas/TravelStyle' } }
        interests: { type: array, items: { type: string } }
        languages_spoken: { type: array, items: { $ref: '#/components/schemas/LocaleTag' } }
        presence: { $ref: '#/components/schemas/TravelerPresence' }
        shared:
          type: object
          required: [travel_styles, interests, languages]
          properties:
            travel_styles: { type: array, items: { $ref: '#/components/schemas/TravelStyle' } }
            interests: { type: array, items: { type: string } }
            languages: { type: array, items: { $ref: '#/components/schemas/LocaleTag' } }
        compatibility: { type: string, enum: [high, medium, low], description: Bucketed; raw scores are not exposed. }
        relationship: { $ref: '#/components/schemas/RelationshipState' }
        can_request_connection: { type: boolean }
    TravelerCardPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TravelerCard' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateConnectionRequestRequest:
      type: object
      additionalProperties: false
      required: [recipient_id, context]
      properties:
        recipient_id: { $ref: '#/components/schemas/Uuid' }
        context: { $ref: '#/components/schemas/ConnectionContext' }
        context_ref_id: { $ref: '#/components/schemas/Uuid' }
        note: { type: string, maxLength: 140 }
    ConnectionRequest:
      type: object
      required: [id, requester, recipient, status, context, note, created_at, responded_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        requester: { $ref: '#/components/schemas/UserSummary' }
        recipient: { $ref: '#/components/schemas/UserSummary' }
        status: { $ref: '#/components/schemas/ConnectionRequestStatus' }
        context: { $ref: '#/components/schemas/ConnectionContext' }
        note: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        responded_at: { $ref: '#/components/schemas/NullableTimestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    ConnectionRequestPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ConnectionRequest' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Connection:
      type: object
      required: [user, connected_at, conversation_id]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        connected_at: { $ref: '#/components/schemas/Timestamp' }
        conversation_id: { type: [string, 'null'], format: uuid }
    ConnectionPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Relationship:
      type: object
      required: [user_id, state, pending_request_id, cooldown_until, can_request_connection, can_message, is_following, is_followed_by]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        state: { $ref: '#/components/schemas/RelationshipState' }
        pending_request_id: { type: [string, 'null'], format: uuid }
        cooldown_until: { $ref: '#/components/schemas/NullableTimestamp' }
        can_request_connection: { type: boolean }
        can_message: { type: boolean }
        is_following: { type: boolean }
        is_followed_by: { type: boolean }

    # ───────── Messaging ─────────
    MessagePreview:
      type: object
      required: [id, seq, sender_id, kind, snippet, deleted, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, format: int64 }
        sender_id: { type: [string, 'null'], format: uuid }
        kind: { $ref: '#/components/schemas/MessageKind' }
        snippet: { type: [string, 'null'], maxLength: 140 }
        deleted: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Conversation:
      type: object
      required: [id, kind, title, avatar, group_id, challenge_team_id, counterpart, last_message, last_seq, unread_count, read_through_seq, delivered_through_seq, muted_until, notification_level, can_send, send_restriction, created_at, last_message_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ConversationKind' }
        title: { type: [string, 'null'] }
        avatar:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        group_id: { type: [string, 'null'], format: uuid }
        challenge_team_id: { type: [string, 'null'], format: uuid }
        counterpart:
          description: Direct conversations only.
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        last_message:
          anyOf:
            - { $ref: '#/components/schemas/MessagePreview' }
            - { type: 'null' }
        last_seq: { type: integer, format: int64, minimum: 0 }
        unread_count: { type: integer, minimum: 0 }
        read_through_seq: { type: integer, format: int64, minimum: 0 }
        delivered_through_seq: { type: integer, format: int64, minimum: 0 }
        muted_until: { $ref: '#/components/schemas/NullableTimestamp' }
        notification_level: { $ref: '#/components/schemas/NotificationLevel' }
        can_send: { type: boolean }
        send_restriction: { type: [string, 'null'], enum: [connection_required, blocked, member_restricted, chat_admins_only, archived, null] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_message_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ConversationPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    OpenDirectConversationRequest:
      type: object
      additionalProperties: false
      required: [kind, user_id]
      properties:
        kind: { type: string, const: direct }
        user_id: { $ref: '#/components/schemas/Uuid' }
    MessageReactionSummary:
      type: object
      required: [emoji, count, reacted_by_me]
      properties:
        emoji: { type: string }
        count: { type: integer, minimum: 1 }
        reacted_by_me: { type: boolean }
    Message:
      type: object
      required: [id, conversation_id, seq, sender, kind, body, attachments, reply_to, thread_root_id, thread_reply_count, mentions, reactions, pinned, moderation_state, edited_at, deleted_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, format: int64, minimum: 1 }
        client_message_id: { type: [string, 'null'], format: uuid, description: Present only for the sender. }
        sender:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        kind: { $ref: '#/components/schemas/MessageKind' }
        body: { type: [string, 'null'], maxLength: 4000, description: Null for tombstones. }
        attachments: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
        reply_to:
          anyOf:
            - { $ref: '#/components/schemas/MessagePreview' }
            - { type: 'null' }
        thread_root_id: { type: [string, 'null'], format: uuid }
        thread_reply_count: { type: integer, minimum: 0 }
        mentions: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        reactions: { type: array, items: { $ref: '#/components/schemas/MessageReactionSummary' } }
        pinned: { type: boolean }
        moderation_state: { type: string, enum: [visible, removed_by_moderator, removed_by_admin] }
        edited_at: { $ref: '#/components/schemas/NullableTimestamp' }
        deleted_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    MessageList:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Message' } }
        page: { $ref: '#/components/schemas/SeqPageInfo' }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [client_message_id]
      anyOf:
        - { required: [body] }
        - { required: [attachment_media_ids] }
      properties:
        client_message_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [text, image], default: text }
        body: { type: string, minLength: 1, maxLength: 4000 }
        attachment_media_ids: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Uuid' } }
        reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
        thread_root_id: { $ref: '#/components/schemas/Uuid' }
        mentions: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    UpdateReceiptsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        read_through_seq: { type: integer, format: int64, minimum: 0 }
        delivered_through_seq: { type: integer, format: int64, minimum: 0 }
    ReceiptState:
      type: object
      required: [conversation_id, read_through_seq, delivered_through_seq, updated_at]
      properties:
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        read_through_seq: { type: integer, format: int64 }
        delivered_through_seq: { type: integer, format: int64 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    MuteConversationRequest:
      type: object
      additionalProperties: false
      required: [muted_until]
      properties:
        muted_until: { $ref: '#/components/schemas/NullableTimestamp' }
        notification_level: { $ref: '#/components/schemas/NotificationLevel' }

    # ───────── Groups ─────────
    GroupSummary:
      type: object
      required: [id, name, cover, primary_destination, start_date, end_date, member_count]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        cover:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        primary_destination: { $ref: '#/components/schemas/DestinationSummary' }
        start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        member_count: { type: integer, minimum: 0 }
    MyGroupMembership:
      type: object
      required: [role, status, permissions, restricted_until, joined_at]
      properties:
        role: { $ref: '#/components/schemas/GroupRoleKey' }
        status: { $ref: '#/components/schemas/GroupMembershipStatus' }
        permissions:
          type: array
          description: Effective permissions now, after applying the group's premium status (safety permissions are never removed).
          items: { $ref: '#/components/schemas/GroupPermission' }
        restricted_until: { $ref: '#/components/schemas/NullableTimestamp' }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    Group:
      type: object
      required: [id, name, description, cover, primary_destination, trip_id, start_date, end_date, visibility, join_policy, member_capacity, member_count, interests, owner, status, conversation_id, premium_features_active, premium_grace_until, my_membership, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 3, maxLength: 60 }
        description: { type: [string, 'null'], maxLength: 1000 }
        cover:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        primary_destination: { $ref: '#/components/schemas/DestinationSummary' }
        trip_id: { type: [string, 'null'], format: uuid }
        start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        join_policy: { $ref: '#/components/schemas/GroupJoinPolicy' }
        member_capacity: { type: integer, minimum: 2 }
        member_count: { type: integer, minimum: 0 }
        interests: { type: array, items: { type: string } }
        owner: { $ref: '#/components/schemas/UserSummary' }
        status: { type: string, enum: [active, archived, suspended] }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        premium_features_active:
          type: boolean
          description: Derived from the OWNER's entitlement (active, or within the admin grace period after lapse).
        premium_grace_until:
          description: Set when the owner's premium has lapsed and the group is in its admin grace period.
          $ref: '#/components/schemas/NullableTimestamp'
        my_membership:
          anyOf:
            - { $ref: '#/components/schemas/MyGroupMembership' }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    GroupPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Group' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name, primary_destination_id]
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        cover_media_id: { $ref: '#/components/schemas/Uuid' }
        primary_destination_id: { $ref: '#/components/schemas/Uuid' }
        trip_id: { $ref: '#/components/schemas/Uuid' }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        visibility: { allOf: [{ $ref: '#/components/schemas/GroupVisibility' }], default: private }
        join_policy: { allOf: [{ $ref: '#/components/schemas/GroupJoinPolicy' }], default: invite_only }
        member_capacity: { type: integer, minimum: 2, maximum: 50, default: 20 }
        interests: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, maxLength: 40 } }
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 60 }
        description: { type: [string, 'null'], maxLength: 1000 }
        cover_media_id: { type: [string, 'null'], format: uuid }
        primary_destination_id: { $ref: '#/components/schemas/Uuid' }
        trip_id: { type: [string, 'null'], format: uuid }
        start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        visibility: { $ref: '#/components/schemas/GroupVisibility' }
        join_policy: { $ref: '#/components/schemas/GroupJoinPolicy' }
        member_capacity: { type: integer, minimum: 2, maximum: 50 }
        interests: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, maxLength: 40 } }
    GroupSettings:
      type: object
      required: [members_can_invite, chat_mode, new_member_history, challenge_defaults, version]
      properties:
        members_can_invite: { type: boolean }
        chat_mode: { type: string, enum: [everyone, admins_only] }
        new_member_history: { type: string, enum: [full, from_join] }
        challenge_defaults: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
    UpdateGroupSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        members_can_invite: { type: boolean }
        chat_mode: { type: string, enum: [everyone, admins_only] }
        new_member_history: { type: string, enum: [full, from_join] }
        challenge_defaults: { type: object, additionalProperties: true }
    GroupRole:
      type: object
      required: [key, rank, permissions, is_system]
      properties:
        key: { $ref: '#/components/schemas/GroupRoleKey' }
        rank: { type: integer }
        permissions: { type: array, items: { $ref: '#/components/schemas/GroupPermission' } }
        is_system: { type: boolean }
    GroupMember:
      type: object
      required: [group_id, user, role, status, joined_at, restricted_until, invited_by]
      properties:
        group_id: { $ref: '#/components/schemas/Uuid' }
        user: { $ref: '#/components/schemas/UserSummary' }
        role: { $ref: '#/components/schemas/GroupRoleKey' }
        status: { $ref: '#/components/schemas/GroupMembershipStatus' }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
        restricted_until: { $ref: '#/components/schemas/NullableTimestamp' }
        invited_by:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
    GroupMemberPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    GroupInvitation:
      type: object
      required: [id, group, kind, invitee, created_by, max_uses, use_count, expires_at, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        group: { $ref: '#/components/schemas/GroupSummary' }
        kind: { type: string, enum: [direct, link] }
        invitee:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        created_by:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        max_uses: { type: integer, minimum: 1 }
        use_count: { type: integer, minimum: 0 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/GroupInvitationStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    GroupInvitationPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GroupInvitation' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateGroupInvitationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, invitee_user_id]
          properties:
            kind: { type: string, const: direct }
            invitee_user_id: { $ref: '#/components/schemas/Uuid' }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, const: link }
            max_uses: { type: integer, minimum: 1, maximum: 100, default: 10 }
            expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
    CreatedGroupInvitation:
      type: object
      required: [invitation, token, url]
      properties:
        invitation: { $ref: '#/components/schemas/GroupInvitation' }
        token: { type: [string, 'null'], description: Link invitations only. Shown exactly once; only its hash is stored. }
        url: { type: [string, 'null'], format: uri, description: 'Link invitations only. The token is carried in the URL fragment (`#t=`), never in the path or query.' }
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    GroupInvitationPreview:
      type: object
      required: [group, inviter, expires_at, is_member]
      properties:
        group: { $ref: '#/components/schemas/GroupSummary' }
        inviter:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        is_member: { type: boolean }
    GroupJoinRequest:
      type: object
      required: [id, group_id, user, message, status, created_at, reviewed_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        group_id: { $ref: '#/components/schemas/Uuid' }
        user: { $ref: '#/components/schemas/UserSummary' }
        message: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        reviewed_at: { $ref: '#/components/schemas/NullableTimestamp' }
    GroupJoinRequestPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/GroupJoinRequest' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    OwnershipTransfer:
      type: object
      required: [id, group_id, from_user, to_user, status, created_at, expires_at, responded_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        group_id: { $ref: '#/components/schemas/Uuid' }
        from_user: { $ref: '#/components/schemas/UserSummary' }
        to_user: { $ref: '#/components/schemas/UserSummary' }
        status: { type: string, enum: [pending, accepted, declined, cancelled, expired] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        responded_at: { $ref: '#/components/schemas/NullableTimestamp' }
    CreateAnnouncementRequest:
      type: object
      additionalProperties: false
      required: [client_message_id, body]
      properties:
        client_message_id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string, minLength: 1, maxLength: 4000 }
        pin: { type: boolean, default: false }

    # ───────── Challenges ─────────
    AnswerNormalization:
      type: object
      additionalProperties: false
      properties:
        case_fold: { type: boolean, default: true }
        strip_accents: { type: boolean, default: true }
        strip_punctuation: { type: boolean, default: true }
        collapse_whitespace: { type: boolean, default: true }
        strip_articles: { type: array, items: { $ref: '#/components/schemas/LocaleTag' }, description: 'Locales whose leading articles are removed (e.g. "the", "o", "la").' }
    ChallengeHint:
      type: object
      required: [id, sort_order, body, released_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sort_order: { type: integer }
        body: { type: string, maxLength: 500 }
        released_at: { $ref: '#/components/schemas/Timestamp' }
    ManagedChallengeHint:
      type: object
      required: [id, sort_order, body, release_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sort_order: { type: integer }
        body: { type: string, maxLength: 500 }
        release_at: { $ref: '#/components/schemas/NullableTimestamp' }
    RewardSummary:
      type: object
      required: [id, reward_type, title, description, sponsor_name, quantity, terms_url]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reward_type: { $ref: '#/components/schemas/RewardType' }
        title: { type: string }
        description: { type: [string, 'null'] }
        sponsor_name: { type: [string, 'null'] }
        quantity: { type: integer, minimum: 1 }
        terms_url: { type: [string, 'null'], format: uri }
    ChallengeParticipation:
      type: object
      required: [attempts_used, attempts_remaining, next_attempt_at, team_id, is_captain, status]
      properties:
        attempts_used: { type: integer, minimum: 0 }
        attempts_remaining: { type: integer, minimum: 0 }
        next_attempt_at: { $ref: '#/components/schemas/NullableTimestamp' }
        team_id: { type: [string, 'null'], format: uuid }
        is_captain: { type: boolean }
        status: { type: string, enum: [active, disqualified, withdrawn] }
    Challenge:
      type: object
      description: Member view. NEVER contains accepted answers, judging criteria, AI rationales or unreleased hints (enforced by a contract lint test).
      required: [id, group_id, kind, title, description, media, solving_mode, validation_method, max_attempts, attempt_cooldown_seconds, winner_policy, max_winners, prize_description, rewards, participation_rules, starts_at, ends_at, status, published_at, results_published_at, rules_version, hints, my_participation]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        group_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [riddle] }
        title: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 4000 }
        media:
          anyOf:
            - { $ref: '#/components/schemas/MediaRef' }
            - { type: 'null' }
        solving_mode: { $ref: '#/components/schemas/SolvingMode' }
        validation_method: { $ref: '#/components/schemas/ValidationMethod' }
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        attempt_cooldown_seconds: { type: integer, minimum: 0 }
        winner_policy: { $ref: '#/components/schemas/WinnerPolicy' }
        max_winners: { type: integer, minimum: 1 }
        prize_description: { type: [string, 'null'], maxLength: 500 }
        rewards: { type: array, items: { $ref: '#/components/schemas/RewardSummary' } }
        participation_rules: { type: [string, 'null'], maxLength: 2000 }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/ChallengeStatus' }
        published_at: { $ref: '#/components/schemas/NullableTimestamp' }
        results_published_at: { $ref: '#/components/schemas/NullableTimestamp' }
        rules_version: { type: integer, minimum: 1 }
        hints: { type: array, description: Released hints only., items: { $ref: '#/components/schemas/ChallengeHint' } }
        my_participation:
          anyOf:
            - { $ref: '#/components/schemas/ChallengeParticipation' }
            - { type: 'null' }
    ChallengeManagerView:
      description: Manager view (`challenges.manage`). Includes all hints and counts. Accepted answers are still only available via the judge-only answers endpoint.
      allOf:
        - { $ref: '#/components/schemas/Challenge' }
        - type: object
          required: [all_hints, normalization, answer_count, participant_count, pending_review_count, reward_details, version]
          properties:
            all_hints: { type: array, items: { $ref: '#/components/schemas/ManagedChallengeHint' } }
            normalization: { $ref: '#/components/schemas/AnswerNormalization' }
            answer_count: { type: integer, minimum: 0 }
            participant_count: { type: integer, minimum: 0 }
            pending_review_count: { type: integer, minimum: 0 }
            reward_details: { type: array, items: { $ref: '#/components/schemas/ChallengeReward' } }
            version: { type: integer, minimum: 1 }
    ChallengePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateRewardRequest:
      type: object
      additionalProperties: false
      description: '`eligibility_rules` is required for `discount_code` and `promotional`. Those types also require platform review before the challenge can be published.'
      required: [reward_type, title, quantity, fulfillment_owner]
      properties:
        reward_type: { $ref: '#/components/schemas/RewardType' }
        title: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        badge_key: { type: string, maxLength: 60 }
        sponsor_name: { type: string, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        eligibility_rules: { type: string, maxLength: 2000 }
        terms_url: { type: string, format: uri }
        fulfillment_owner: { type: string, enum: [platform, group_admin, sponsor] }
    ChallengeReward:
      type: object
      required: [id, challenge_id, reward_type, title, description, badge, sponsor_name, quantity, eligibility_rules, terms_url, fulfillment_owner, requires_platform_review, review_status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        reward_type: { $ref: '#/components/schemas/RewardType' }
        title: { type: string }
        description: { type: [string, 'null'] }
        badge:
          anyOf:
            - { $ref: '#/components/schemas/BadgeSummary' }
            - { type: 'null' }
        sponsor_name: { type: [string, 'null'] }
        quantity: { type: integer }
        eligibility_rules: { type: [string, 'null'] }
        terms_url: { type: [string, 'null'], format: uri }
        fulfillment_owner: { type: string, enum: [platform, group_admin, sponsor] }
        requires_platform_review: { type: boolean }
        review_status: { type: string, enum: [not_required, pending, approved, rejected] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    CreateChallengeRequest:
      type: object
      additionalProperties: false
      description: '`accepted_answers` is required for `exact` and `ai_assisted` (used as the reference) and optional for `admin_review`. It is write-only and never returned.'
      required: [kind, title, description, solving_mode, validation_method, starts_at, ends_at, max_attempts, winner_policy]
      properties:
        kind: { type: string, const: riddle }
        title: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, minLength: 10, maxLength: 4000 }
        media_id: { $ref: '#/components/schemas/Uuid' }
        solving_mode: { $ref: '#/components/schemas/SolvingMode' }
        validation_method: { $ref: '#/components/schemas/ValidationMethod' }
        accepted_answers:
          type: array
          writeOnly: true
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
        normalization: { $ref: '#/components/schemas/AnswerNormalization' }
        hints:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 500 }
              release_at: { $ref: '#/components/schemas/Timestamp' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        attempt_cooldown_seconds: { type: integer, minimum: 0, maximum: 3600, default: 30 }
        winner_policy: { $ref: '#/components/schemas/WinnerPolicy' }
        max_winners: { type: integer, minimum: 1, maximum: 50, default: 1 }
        prize_description: { type: string, maxLength: 500 }
        rewards: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/CreateRewardRequest' } }
        participation_rules: { type: string, maxLength: 2000 }
    UpdateChallengeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, minLength: 10, maxLength: 4000 }
        media_id: { type: [string, 'null'], format: uuid }
        accepted_answers:
          type: array
          writeOnly: true
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
        normalization: { $ref: '#/components/schemas/AnswerNormalization' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        attempt_cooldown_seconds: { type: integer, minimum: 0, maximum: 3600 }
        winner_policy: { $ref: '#/components/schemas/WinnerPolicy' }
        max_winners: { type: integer, minimum: 1, maximum: 50 }
        prize_description: { type: [string, 'null'], maxLength: 500 }
        participation_rules: { type: [string, 'null'], maxLength: 2000 }
    ChallengeTeam:
      type: object
      required: [id, challenge_id, name, captain, members, conversation_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        captain:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        members: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        conversation_id: { type: [string, 'null'], format: uuid }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ChallengeTeamPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChallengeTeam' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 500 }
        team_id: { $ref: '#/components/schemas/Uuid' }
    SubmissionResult:
      type: object
      required: [submission_id, attempt_no, evaluation_status, attempts_remaining, next_attempt_at, is_provisional_winner]
      properties:
        submission_id: { $ref: '#/components/schemas/Uuid' }
        attempt_no: { type: integer, minimum: 1 }
        evaluation_status: { $ref: '#/components/schemas/SubmissionEvaluationStatus' }
        attempts_remaining: { type: integer, minimum: 0 }
        next_attempt_at: { $ref: '#/components/schemas/NullableTimestamp' }
        is_provisional_winner: { type: boolean }
    ChallengeSubmission:
      type: object
      description: '`ai_confidence` and `ai_rationale` are populated only for judges.'
      required: [id, challenge_id, submitted_by, team_id, attempt_no, answer_text, evaluation_status, evaluator, rules_version, submitted_at, evaluated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        submitted_by:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        team_id: { type: [string, 'null'], format: uuid }
        attempt_no: { type: integer, minimum: 1 }
        answer_text: { type: string }
        evaluation_status: { $ref: '#/components/schemas/SubmissionEvaluationStatus' }
        evaluator: { type: [string, 'null'], enum: [exact, ai, admin, null] }
        ai_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        ai_rationale: { type: [string, 'null'] }
        rules_version: { type: integer }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        evaluated_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ChallengeSubmissionPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChallengeSubmission' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    JudgeSubmissionRequest:
      type: object
      additionalProperties: false
      required: [evaluation_status]
      properties:
        evaluation_status: { type: string, enum: [correct, incorrect, void] }
        note: { type: string, maxLength: 500 }
    AcceptedAnswer:
      type: object
      required: [id, answer_display, answer_normalized]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        answer_display: { type: string }
        answer_normalized: { type: string }
    ChallengeWinner:
      type: object
      required: [id, rank, user, team, status, determined_by, determined_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rank: { type: integer, minimum: 1 }
        user:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        team:
          anyOf:
            - type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { type: string }
            - { type: 'null' }
        status: { type: string, enum: [provisional, confirmed, revoked] }
        determined_by: { type: string, enum: [system, admin] }
        determined_at: { $ref: '#/components/schemas/Timestamp' }
    ChallengeResults:
      type: object
      required: [challenge_id, status, published, results_published_at, participant_count, winners]
      properties:
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ChallengeStatus' }
        published: { type: boolean }
        results_published_at: { $ref: '#/components/schemas/NullableTimestamp' }
        participant_count: { type: integer, minimum: 0 }
        winners: { type: array, items: { $ref: '#/components/schemas/ChallengeWinner' } }
    ChallengeDispute:
      type: object
      required: [id, challenge_id, raised_by, submission_id, reason, status, resolution_note, created_at, resolved_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        raised_by:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        submission_id: { type: [string, 'null'], format: uuid }
        reason: { type: string }
        status: { type: string, enum: [open, upheld, rejected] }
        resolution_note: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ChallengeDisputePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChallengeDispute' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    RewardFulfillment:
      type: object
      description: Never contains the reward secret (discount code).
      required: [id, challenge_reward_id, winner_id, recipient, status, issued_at, delivered_at, notes, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        challenge_reward_id: { $ref: '#/components/schemas/Uuid' }
        winner_id: { $ref: '#/components/schemas/Uuid' }
        recipient:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/FulfillmentStatus' }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        delivered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        notes: { type: [string, 'null'] }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RewardFulfillmentPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RewardFulfillment' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    RewardFulfillmentTransitionRequest:
      type: object
      additionalProperties: false
      required: [to_status]
      properties:
        to_status: { $ref: '#/components/schemas/FulfillmentStatus' }
        note: { type: string, maxLength: 1000 }
        secret:
          type: string
          writeOnly: true
          maxLength: 200
          description: Discount code, supplied when moving to `issued`. Envelope-encrypted at rest and shown only to the recipient.
    MyReward:
      type: object
      required: [fulfillment_id, challenge, reward, status, secret, issued_at, delivered_at]
      properties:
        fulfillment_id: { $ref: '#/components/schemas/Uuid' }
        challenge:
          type: object
          required: [id, title, group_id]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            title: { type: string }
            group_id: { $ref: '#/components/schemas/Uuid' }
        reward: { $ref: '#/components/schemas/RewardSummary' }
        status: { $ref: '#/components/schemas/FulfillmentStatus' }
        secret: { type: [string, 'null'], description: 'Discount code, visible only to the recipient once issued.' }
        issued_at: { $ref: '#/components/schemas/NullableTimestamp' }
        delivered_at: { $ref: '#/components/schemas/NullableTimestamp' }
    MyRewardPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MyReward' } }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ───────── AI ─────────
    SourceAttribution:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [catalog_place, destination_guide, licensed_provider, ai_general_knowledge] }
        ref_id: { type: [string, 'null'], format: uuid }
        provider: { type: [string, 'null'] }
        license: { type: [string, 'null'] }
        url: { type: [string, 'null'], format: uri }
        retrieved_at: { $ref: '#/components/schemas/NullableTimestamp' }
    GenerateItineraryRequest:
      type: object
      additionalProperties: false
      description: The trip may be at most 21 days. `preferences` is free text and must not contain personal data, a constraint the client UI explains.
      required: [destination_id, start_date, end_date]
      properties:
        destination_id: { $ref: '#/components/schemas/Uuid' }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        interests: { type: array, maxItems: 15, uniqueItems: true, items: { type: string, maxLength: 40 } }
        travel_styles: { type: array, maxItems: 9, uniqueItems: true, items: { $ref: '#/components/schemas/TravelStyle' } }
        pace: { type: string, enum: [relaxed, moderate, packed], default: moderate }
        budget_level: { type: string, enum: [budget, moderate, premium], default: moderate }
        party:
          type: object
          additionalProperties: false
          properties:
            adults: { type: integer, minimum: 1, maximum: 20, default: 1 }
            children: { type: integer, minimum: 0, maximum: 10, default: 0 }
        preferences: { type: string, maxLength: 500 }
        include_social_opportunities: { type: boolean, default: false, description: 'Suggest public, group-friendly activities. Never includes other users'' data.' }
    ProposedActivity:
      type: object
      additionalProperties: false
      description: |
        Schema-validated AI output. By design there are NO fields for opening hours, prices, ticket or reservation
        availability, live transit or safety claims. `place` and `place_data_freshness_at` are joined server-side
        from the licensed catalog, not generated.
      required: [kind, title, description, place_id, unverified, suggested_start_time, estimated_duration_minutes, category, confidence, rationale, social_opportunity, source_attribution, place, place_data_freshness_at]
      properties:
        kind: { $ref: '#/components/schemas/ItineraryItemKind' }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 600 }
        place_id: { type: [string, 'null'], format: uuid, description: Must be a catalog place in the destination candidate set. }
        unverified: { type: boolean, description: True when the suggestion is not backed by a catalog place. }
        suggested_start_time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        estimated_duration_minutes: { type: integer, minimum: 5, maximum: 720 }
        category:
          anyOf:
            - { $ref: '#/components/schemas/PlaceCategory' }
            - { type: 'null' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rationale: { type: string, maxLength: 300 }
        social_opportunity: { type: boolean }
        source_attribution: { type: array, items: { $ref: '#/components/schemas/SourceAttribution' } }
        place:
          anyOf:
            - { $ref: '#/components/schemas/PlaceSummary' }
            - { type: 'null' }
        place_data_freshness_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ProposedDay:
      type: object
      additionalProperties: false
      required: [day_index, date, destination_id, theme, items]
      properties:
        day_index: { type: integer, minimum: 0 }
        date: { $ref: '#/components/schemas/LocalDate' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        theme: { type: [string, 'null'], maxLength: 80 }
        items: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ProposedActivity' } }
    Itinerary:
      type: object
      additionalProperties: false
      required: [destination, start_date, end_date, time_zone, days, sources, generated_at]
      properties:
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        time_zone: { $ref: '#/components/schemas/TimeZone' }
        days: { type: array, minItems: 1, maxItems: 21, items: { $ref: '#/components/schemas/ProposedDay' } }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceAttribution' } }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
    ItineraryProposal:
      type: object
      required: [itinerary, warnings, disclaimer, prompt_version, confidence]
      properties:
        itinerary: { $ref: '#/components/schemas/Itinerary' }
        warnings: { type: array, items: { type: string } }
        disclaimer: { type: string, description: 'Localized notice that suggestions must be verified (hours, prices, safety).' }
        prompt_version: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, description: Overall confidence. }
        freshness:
          type: object
          properties:
            catalog_data_as_of: { $ref: '#/components/schemas/NullableTimestamp' }
    AIGeneration:
      type: object
      required: [id, feature, status, created_at, completed_at, result, error, quota]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        feature: { type: string, enum: [itinerary_generate, trip_replan] }
        status: { type: string, enum: [pending, succeeded, failed] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        result:
          anyOf:
            - { $ref: '#/components/schemas/ItineraryProposal' }
            - { type: 'null' }
        error:
          anyOf:
            - { $ref: '#/components/schemas/Problem' }
            - { type: 'null' }
        quota: { $ref: '#/components/schemas/QuotaStatus' }
    ReplanTripRequest:
      type: object
      additionalProperties: false
      required: [instruction, base_version]
      properties:
        instruction: { type: string, minLength: 3, maxLength: 500 }
        base_version: { type: integer, minimum: 1 }
        day_indexes: { type: array, items: { type: integer, minimum: 0 } }
        constraints:
          type: object
          additionalProperties: false
          properties:
            keep_item_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
            avoid_categories: { type: array, items: { $ref: '#/components/schemas/PlaceCategory' } }
            pace: { type: string, enum: [relaxed, moderate, packed] }

    # ───────── Trips ─────────
    TripDestination:
      type: object
      required: [destination, start_date, end_date, sort_order]
      properties:
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        start_date: { $ref: '#/components/schemas/NullableLocalDate' }
        end_date: { $ref: '#/components/schemas/NullableLocalDate' }
        sort_order: { type: integer }
    ItineraryItem:
      type: object
      required: [id, sort_order, kind, place, title, notes, start_time, duration_minutes, origin, ai_confidence, unverified, source_attribution, data_freshness_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sort_order: { type: string, pattern: '^\d+(\.\d+)?$', description: Fractional ordering key (decimal string). }
        kind: { $ref: '#/components/schemas/ItineraryItemKind' }
        place:
          anyOf:
            - { $ref: '#/components/schemas/PlaceSummary' }
            - { type: 'null' }
        title: { type: string, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        start_time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        duration_minutes: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
        origin: { type: string, enum: [user, ai] }
        ai_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        unverified: { type: boolean }
        source_attribution: { type: array, items: { $ref: '#/components/schemas/SourceAttribution' } }
        data_freshness_at: { $ref: '#/components/schemas/NullableTimestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ItineraryDay:
      type: object
      required: [id, day_index, date, destination, notes, items]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        day_index: { type: integer, minimum: 0 }
        date: { $ref: '#/components/schemas/NullableLocalDate' }
        destination:
          anyOf:
            - { $ref: '#/components/schemas/DestinationSummary' }
            - { type: 'null' }
        notes: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/ItineraryItem' } }
    TripSummary:
      type: object
      required: [id, title, start_date, end_date, status, visibility, origin, destinations, role, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        status: { $ref: '#/components/schemas/TripStatus' }
        visibility: { $ref: '#/components/schemas/TripVisibility' }
        origin: { type: string, enum: [manual, ai_generated, ai_assisted] }
        destinations: { type: array, items: { $ref: '#/components/schemas/DestinationSummary' } }
        role: { type: string, enum: [owner, editor, viewer] }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    TripSummaryPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Trip:
      type: object
      required: [id, owner, title, start_date, end_date, visibility, group_id, origin, status, destinations, days, collaborators, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        owner: { $ref: '#/components/schemas/UserSummary' }
        title: { type: string, maxLength: 100 }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        visibility: { $ref: '#/components/schemas/TripVisibility' }
        group_id: { type: [string, 'null'], format: uuid }
        origin: { type: string, enum: [manual, ai_generated, ai_assisted] }
        status: { $ref: '#/components/schemas/TripStatus' }
        destinations: { type: array, items: { $ref: '#/components/schemas/TripDestination' } }
        days: { type: array, items: { $ref: '#/components/schemas/ItineraryDay' } }
        collaborators:
          type: array
          items:
            type: object
            required: [user, role]
            properties:
              user: { $ref: '#/components/schemas/UserSummary' }
              role: { type: string, enum: [editor, viewer] }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [title, start_date, end_date, destination_ids]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        destination_ids: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Uuid' } }
        visibility: { allOf: [{ $ref: '#/components/schemas/TripVisibility' }], default: private }
        group_id: { $ref: '#/components/schemas/Uuid' }
    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        start_date: { $ref: '#/components/schemas/LocalDate' }
        end_date: { $ref: '#/components/schemas/LocalDate' }
        destination_ids: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Uuid' } }
        visibility: { $ref: '#/components/schemas/TripVisibility' }
        status: { $ref: '#/components/schemas/TripStatus' }
        group_id: { type: [string, 'null'], format: uuid }
    ItineraryDayInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        day_index: { type: integer, minimum: 0 }
        date: { $ref: '#/components/schemas/LocalDate' }
        destination_id: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'], maxLength: 2000 }
    ItineraryItemInput:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind: { $ref: '#/components/schemas/ItineraryItemKind' }
        place_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
        start_time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        duration_minutes: { type: integer, minimum: 0, maximum: 1440 }
        after_item_id: { type: [string, 'null'], format: uuid, description: Insert after this item (null = first). }
    ItineraryItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { $ref: '#/components/schemas/ItineraryItemKind' }
        place_id: { type: [string, 'null'], format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        start_time: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        duration_minutes: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
        day_id: { $ref: '#/components/schemas/Uuid' }
        after_item_id: { type: [string, 'null'], format: uuid }
    TripSyncOperation:
      type: object
      additionalProperties: false
      required: [op_id, entity, action, entity_id, client_updated_at]
      properties:
        op_id: { $ref: '#/components/schemas/Uuid' }
        entity: { type: string, enum: [trip, day, item] }
        action: { type: string, enum: [create, update, delete] }
        entity_id: { $ref: '#/components/schemas/Uuid' }
        parent_id: { type: [string, 'null'], format: uuid, description: Day ID for item creates. }
        fields: { type: object, additionalProperties: true, description: Validated against the matching input schema server-side. }
        client_updated_at: { $ref: '#/components/schemas/Timestamp' }
    TripSyncRequest:
      type: object
      additionalProperties: false
      required: [base_version, operations]
      properties:
        base_version: { type: integer, minimum: 1 }
        operations: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/TripSyncOperation' } }
    TripSyncResult:
      type: object
      required: [trip, applied_op_ids, conflicts]
      properties:
        trip: { $ref: '#/components/schemas/Trip' }
        applied_op_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
        conflicts:
          type: array
          items:
            type: object
            required: [op_id, entity, entity_id, reason, server_state]
            properties:
              op_id: { $ref: '#/components/schemas/Uuid' }
              entity: { type: string, enum: [trip, day, item] }
              entity_id: { $ref: '#/components/schemas/Uuid' }
              reason: { type: string, enum: [modified_on_server, deleted_on_server, invalid] }
              server_state: { type: [object, 'null'], additionalProperties: true }
    SavedPlace:
      type: object
      required: [place, collection, note, created_at]
      properties:
        place: { $ref: '#/components/schemas/PlaceSummary' }
        collection: { type: string }
        note: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    SavedPlacePage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ───────── Guides & offline ─────────
    GuideSummary:
      type: object
      required: [id, destination_id, locale, title, summary, tier, entitled, product_id, version, published_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        title: { type: string }
        summary: { type: string }
        tier: { $ref: '#/components/schemas/ContentTier' }
        entitled: { type: boolean }
        product_id: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        published_at: { $ref: '#/components/schemas/Timestamp' }
    Guide:
      type: object
      required: [id, destination, locale, title, summary, sections, tier, version, content_license, attribution, published_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        title: { type: string }
        summary: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [id, heading, body_markdown, place_ids]
            properties:
              id: { type: string }
              kind:
                type: string
                enum: [prose, faq]
                default: prose
                description: '`faq` sections carry non-empty `faq_items` (structured for FAQPage markup); `body_markdown` is then an optional intro and may be empty.'
              heading: { type: string }
              body_markdown: { type: string }
              place_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
              faq_items:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [question, answer_markdown]
                  properties:
                    question: { type: string, maxLength: 300 }
                    answer_markdown: { type: string, maxLength: 4000 }
        tier: { $ref: '#/components/schemas/ContentTier' }
        version: { type: integer }
        content_license: { type: string }
        attribution: { type: [string, 'null'] }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AudioTourSummary:
      type: object
      required: [id, destination_id, locale, title, description, tier, entitled, total_duration_s, stop_count, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        title: { type: string }
        description: { type: string }
        tier: { $ref: '#/components/schemas/ContentTier' }
        entitled: { type: boolean }
        total_duration_s: { type: integer }
        stop_count: { type: integer }
        version: { type: integer }
    AudioTourStop:
      type: object
      required: [id, sort_order, place, title, audio, transcript, trigger_radius_m, duration_s]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sort_order: { type: integer }
        place: { $ref: '#/components/schemas/PlaceSummary' }
        title: { type: string }
        audio: { $ref: '#/components/schemas/MediaRef' }
        transcript: { type: [string, 'null'] }
        trigger_radius_m: { type: integer, minimum: 10, maximum: 1000, description: Geofence radius evaluated on device only. }
        duration_s: { type: integer }
    AudioTour:
      type: object
      required: [id, destination, locale, title, description, tier, version, total_duration_s, stops, content_license]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination: { $ref: '#/components/schemas/DestinationSummary' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        title: { type: string }
        description: { type: string }
        tier: { $ref: '#/components/schemas/ContentTier' }
        version: { type: integer }
        total_duration_s: { type: integer }
        stops: { type: array, items: { $ref: '#/components/schemas/AudioTourStop' } }
        content_license: { type: string }
    OfflinePackageSummary:
      type: object
      required: [id, destination_id, locale, kind, version, total_bytes, tier, entitled, min_app_version, license_expires_at, published_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        kind: { $ref: '#/components/schemas/OfflinePackageKind' }
        version: { type: integer, minimum: 1 }
        total_bytes: { type: integer, format: int64 }
        tier: { $ref: '#/components/schemas/ContentTier' }
        entitled: { type: boolean }
        min_app_version: { type: string }
        license_expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        published_at: { $ref: '#/components/schemas/Timestamp' }
    OfflineManifest:
      type: object
      description: Server-signed manifest. The client verifies the signature, then each file's sha256 after download, and compares `version` to detect updates.
      required: [package_id, destination_id, kind, locale, version, files, total_bytes, sha256, min_app_version, content_license, license_expires_at, issued_at, signature_alg, key_id, signature]
      properties:
        package_id: { $ref: '#/components/schemas/Uuid' }
        destination_id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/OfflinePackageKind' }
        locale: { $ref: '#/components/schemas/LocaleTag' }
        version: { type: integer, minimum: 1 }
        files:
          type: array
          items:
            type: object
            required: [path, bytes, sha256, content_type]
            properties:
              path: { type: string, pattern: '^(?!/)(?!.*\.\.)[A-Za-z0-9._/-]+$', description: Relative path; no traversal. }
              bytes: { type: integer, format: int64, minimum: 0 }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              content_type: { type: string }
        total_bytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: Hash of the canonical manifest file list. }
        min_app_version: { type: string }
        content_license: { type: string }
        license_expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        issued_at: { $ref: '#/components/schemas/Timestamp' }
        signature_alg: { type: string, const: Ed25519 }
        key_id: { type: string }
        signature: { type: string, contentEncoding: base64 }
    OfflinePackageLicense:
      type: object
      required: [id, package_id, device_id, granted_at, expires_at, manifest, download, quota]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        package_id: { $ref: '#/components/schemas/Uuid' }
        device_id: { type: string }
        granted_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        manifest: { $ref: '#/components/schemas/OfflineManifest' }
        download:
          type: object
          required: [base_url, expires_at]
          properties:
            base_url: { type: string, format: uri, description: Signed CDN prefix; append the manifest file paths. }
            expires_at: { $ref: '#/components/schemas/Timestamp' }
        quota: { $ref: '#/components/schemas/QuotaStatus' }
    OfflinePackageLicenseSummary:
      type: object
      required: [id, package, device_id, granted_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        package: { $ref: '#/components/schemas/OfflinePackageSummary' }
        device_id: { type: string }
        granted_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }

    # ───────── Billing ─────────
    Product:
      type: object
      required: [id, sku, platform, provider, kind, plan_key, period, entitlement_keys]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sku: { type: string, description: Store product ID or Stripe price ID. }
        platform: { $ref: '#/components/schemas/ProductPlatform' }
        provider: { $ref: '#/components/schemas/BillingProvider' }
        kind: { type: string, enum: [auto_renewable, non_consumable] }
        plan_key: { type: [string, 'null'], enum: [premium, null] }
        period: { type: [string, 'null'], enum: [P1M, P1Y, null] }
        entitlement_keys: { type: array, items: { type: string } }
        grants_content:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [guide, audio_tour, offline_package] }
              id: { $ref: '#/components/schemas/Uuid' }
    Entitlements:
      type: object
      description: |
        Computed server-side as the union of active grants across providers. The shape is fixed by
        docs/07-subscription-entitlement-policy.md. Clients use it for UI only, and every gated action is
        re-checked server-side.
      additionalProperties: false
      required: [plan, status, premium_until, store_grace_until, features, quotas]
      properties:
        plan: { type: string, enum: [free, premium] }
        status: { type: string, enum: [none, active, in_grace_period, in_billing_retry, paused, expired, revoked] }
        premium_until: { $ref: '#/components/schemas/NullableTimestamp' }
        store_grace_until: { $ref: '#/components/schemas/NullableTimestamp' }
        features:
          type: object
          additionalProperties: false
          required: [groups.create, challenges.create, guides.premium, audio_tours.premium, ai.trip_replan]
          properties:
            groups.create: { type: boolean }
            challenges.create: { type: boolean }
            guides.premium: { type: boolean }
            audio_tours.premium: { type: boolean }
            ai.trip_replan: { type: boolean }
        quotas:
          type: object
          additionalProperties: false
          required: [ai.itinerary_generations, ai.trip_replans, offline.packages, groups.owned]
          properties:
            ai.itinerary_generations: { $ref: '#/components/schemas/QuotaStatus' }
            ai.trip_replans: { $ref: '#/components/schemas/QuotaStatus' }
            offline.packages: { $ref: '#/components/schemas/QuotaStatus' }
            groups.owned: { $ref: '#/components/schemas/QuotaStatus' }
        active_subscription:
          description: |
            The subscription currently granting `premium`, or null (free, or premium only from a promotion or
            admin grant). Clients use it to show the right management path (store settings vs. Stripe Customer
            Portal) and to hide web checkout while a store subscription is active (ADR-0012). Optional and
            additive: older clients ignore it.
          anyOf:
            - type: object
              additionalProperties: false
              required: [provider, product_id, auto_renew, management]
              properties:
                provider: { $ref: '#/components/schemas/BillingProvider' }
                product_id: { $ref: '#/components/schemas/Uuid' }
                auto_renew: { type: boolean }
                management:
                  type: string
                  enum: [app_store, google_play, stripe_portal]
                  description: Where the user manages or cancels this subscription.
            - type: 'null'
    VerifyPurchaseRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [provider, signed_transaction]
          properties:
            provider: { type: string, const: apple }
            signed_transaction: { type: string, minLength: 20, maxLength: 16384, description: StoreKit 2 JWS transaction. }
        - type: object
          additionalProperties: false
          required: [provider, product_sku, purchase_token, package_name]
          properties:
            provider: { type: string, const: google }
            product_sku: { type: string, maxLength: 200 }
            purchase_token: { type: string, minLength: 10, maxLength: 4096 }
            package_name: { type: string, maxLength: 200 }
      discriminator:
        propertyName: provider
    VerifyPurchaseResult:
      type: object
      required: [purchase, entitlements]
      properties:
        purchase:
          type: object
          required: [id, provider, product_sku, kind, status, purchased_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            provider: { $ref: '#/components/schemas/BillingProvider' }
            product_sku: { type: string }
            kind: { type: string, enum: [non_consumable, subscription_purchase, renewal] }
            status: { type: string, enum: [verified, refunded, revoked] }
            purchased_at: { $ref: '#/components/schemas/Timestamp' }
        entitlements: { $ref: '#/components/schemas/Entitlements' }
    RestorePurchasesRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [provider, signed_transactions]
          properties:
            provider: { type: string, const: apple }
            signed_transactions: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 16384 } }
        - type: object
          additionalProperties: false
          required: [provider, package_name, purchases]
          properties:
            provider: { type: string, const: google }
            package_name: { type: string, maxLength: 200 }
            purchases:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [product_sku, purchase_token]
                properties:
                  product_sku: { type: string, maxLength: 200 }
                  purchase_token: { type: string, maxLength: 4096 }
      discriminator:
        propertyName: provider
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required: [product_id, success_path, cancel_path]
      properties:
        product_id: { $ref: '#/components/schemas/Uuid' }
        success_path: { type: string, maxLength: 512, pattern: '^/[A-Za-z0-9/_\-.~%?=&]*$', description: Relative path on the configured web origin. }
        cancel_path: { type: string, maxLength: 512, pattern: '^/[A-Za-z0-9/_\-.~%?=&]*$', description: Relative path on the configured web origin. }
    RedirectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
    AppleNotificationRequest:
      type: object
      required: [signedPayload]
      properties:
        signedPayload: { type: string, maxLength: 65536 }
    GooglePubSubPushRequest:
      type: object
      required: [message, subscription]
      properties:
        message:
          type: object
          required: [data, messageId, publishTime]
          properties:
            data: { type: string, contentEncoding: base64 }
            messageId: { type: string }
            publishTime: { $ref: '#/components/schemas/Timestamp' }
            attributes: { type: object, additionalProperties: { type: string } }
        subscription: { type: string }
    StripeEventRequest:
      type: object
      description: Stripe Event object. The signature is verified over the raw body before parsing.
      required: [id, object, type, created, livemode, data]
      additionalProperties: true
      properties:
        id: { type: string, pattern: '^evt_' }
        object: { type: string, const: event }
        type: { type: string }
        created: { type: integer }
        livemode: { type: boolean }
        data:
          type: object
          required: [object]
          properties:
            object: { type: object, additionalProperties: true }

    # ───────── Admin ─────────
    AdminReport:
      type: object
      required: [id, reporter, target_type, target_id, reason, details, priority, status, assigned_to, evidence, resolution_note, related_report_count, created_at, resolved_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        reporter:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { $ref: '#/components/schemas/Uuid' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        details: { type: [string, 'null'] }
        priority: { type: integer }
        status: { $ref: '#/components/schemas/ReportStatus' }
        assigned_to:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        evidence: { type: object, additionalProperties: true, description: Content snapshot captured at report time. Access is audited. }
        resolution_note: { type: [string, 'null'] }
        related_report_count: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/NullableTimestamp' }
    AdminReportPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminReport' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    ModerationActionRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, action, reason_code]
      properties:
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { $ref: '#/components/schemas/Uuid' }
        action: { $ref: '#/components/schemas/ModerationActionType' }
        reason_code: { type: string, maxLength: 40 }
        notes: { type: string, maxLength: 2000 }
        report_id: { $ref: '#/components/schemas/Uuid' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    AdminResolveReportRequest:
      type: object
      additionalProperties: false
      required: [status, resolution_note]
      properties:
        status: { type: string, enum: [actioned, dismissed] }
        resolution_note: { type: string, minLength: 3, maxLength: 2000 }
        action: { $ref: '#/components/schemas/ModerationActionRequest' }
    ModerationAction:
      type: object
      required: [id, scope, group_id, target_type, target_id, action, reason_code, notes, actor, report_id, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [platform, group] }
        group_id: { type: [string, 'null'], format: uuid }
        target_type: { $ref: '#/components/schemas/ReportTargetType' }
        target_id: { $ref: '#/components/schemas/Uuid' }
        action: { $ref: '#/components/schemas/ModerationActionType' }
        reason_code: { type: string }
        notes: { type: [string, 'null'] }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        report_id: { type: [string, 'null'], format: uuid }
        expires_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ModerationActionPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ModerationAction' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    AdminUser:
      type: object
      description: Admin view of an account. Never includes message content, coordinates or session tokens. Viewing `email` is audited.
      required: [id, handle, display_name, status, email, roles, created_at, last_active_on, open_report_count, moderation_action_count, suspended_until]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        handle: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, suspended, deactivated, pending_deletion, deleted] }
        email: { type: [string, 'null'], format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_active_on: { $ref: '#/components/schemas/NullableLocalDate' }
        open_report_count: { type: integer, minimum: 0 }
        moderation_action_count: { type: integer, minimum: 0 }
        suspended_until: { $ref: '#/components/schemas/NullableTimestamp' }
    AdminSuspendUserRequest:
      type: object
      additionalProperties: false
      required: [reason_code, notes, until]
      properties:
        reason_code: { type: string, maxLength: 40 }
        notes: { type: string, minLength: 3, maxLength: 2000 }
        until: { $ref: '#/components/schemas/NullableTimestamp' }
    AuditLogEntry:
      type: object
      required: [id, occurred_at, actor_id, actor_type, action, resource_type, resource_id, scope_group_id, request_id, metadata]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_type: { type: string, enum: [user, admin, system, service] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, 'null'], format: uuid }
        scope_group_id: { type: [string, 'null'], format: uuid }
        request_id: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
    AuditLogPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
        page: { $ref: '#/components/schemas/PageInfo' }
