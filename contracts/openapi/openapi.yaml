  /v1/destinations/lookup:
    get:
      tags: [destinations]
      operationId: lookupDestinationByPath
      summary: Look up a destination by its slug path (SEO-friendly web URLs)
      description: |
        `path` is the `/`-separated chain of per-level path segments from the country down, e.g.
        `brazil/rio-de-janeiro` or `brazil/rio-de-janeiro/copacabana`. Each segment is matched against the child of
        the previous level (`destinations.path_segment`, unique among siblings). Segments are ASCII and
        language-neutral, so URLs are stable across locales. The display name is localized via `Accept-Language`.
      security: [{}, { bearerAuth: [] }]
      x-phase: 1
      x-requirements: [DEST-002, DEST-004]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 300
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*){0,5}$'
          example: brazil/rio-de-janeiro
      responses:
        '200':
          description: Destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Destination' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
