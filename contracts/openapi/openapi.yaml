openapi: 3.1.0
info:
  title: Travel Buddy Platform API
  version: 1.0.0-draft.1
  summary: Contract-first REST API for the Travel Buddy global travel guide and social community platform.
  description: |
    **Normative contract.** Implementations must conform to this document. See
    `docs/05-rest-api-specification.md` for the human-readable companion and
    `docs/02-system-architecture.md` §5 for the platform-wide conventions.

    Conventions summary:
    - Versioned under `/v1`. Health endpoints are unversioned.
    - IDs are UUIDv7 strings. Timestamps are RFC 3339 UTC (`Z`). Calendar dates are `YYYY-MM-DD` in the destination time zone.
    - Errors are `application/problem+json` (RFC 9457) with a stable `code` and the `request_id`.
    - Lists use cursor pagination: `{ "data": [...], "page": { "next_cursor", "has_more" } }`.
    - Operations marked `x-idempotency: required` must send an `Idempotency-Key` header.
    - Mutable aggregates expose `version`. Updates must send `If-Match`.
    - `x-phase` gives the delivery phase. `x-requirements` lists the PRD requirement IDs the operation traces to.
    - `x-rate-limit-class` names the rate-limit class (see docs/05 §5).
    - Responses never include another user's coordinates, distance, email, birth data, or session data.
  contact:
    name: Travel Buddy Platform Team
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.staging.travelbuddy.example
    description: Staging (placeholder host)
  - url: https://api.travelbuddy.example
    description: Production (placeholder host)
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes (unversioned).
  - name: internal
    description: Operator/scheduler endpoints (unversioned). Not for clients.
  - name: config
    description: Client bootstrap configuration and catalogs.
  - name: auth
    description: IdP token exchange and platform session management.
  - name: me
    description: The authenticated user's account, profile, preferences, privacy, consents and data rights.
  - name: profiles
    description: Other users' public profiles.
  - name: destinations
    description: Destination catalog and search.
  - name: places
    description: Public places (attractions, restaurants, etc.).
  - name: location
    description: Browse destination, upcoming destinations and traveler-discovery sessions (coarse only).
  - name: feed
    description: Location-based social feed.
  - name: posts
    description: Travel posts, comments, reactions, bookmarks and shares.
  - name: follows
    description: Following and follow requests.
  - name: safety
    description: Blocking and reporting.
  - name: media
    description: Presigned uploads and media assets.
  - name: discovery
    description: Travel companion discovery (opt-in, destination-scoped).
  - name: connections
    description: Connection requests and connections.
  - name: messaging
    description: Direct and group conversations (REST surface; realtime in docs/06).
  - name: realtime
    description: Realtime gateway support endpoints (browser tickets, ADR-0013).
  - name: groups
    description: Travel companion groups, membership, invitations and administration.
  - name: challenges
    description: Group riddles/challenges, submissions, judging, results and rewards.
  - name: ai
    description: AI travel assistant (structured, schema-validated output).
  - name: trips
    description: Trips, itineraries and saved places.
  - name: guides
    description: Destination guides, audio tours and offline packages.
  - name: billing
    description: Entitlements, purchase verification and store notifications.
  - name: notifications
    description: In-app notifications and push device registration.
  - name: admin
    description: |
      Platform administration and moderation (platform roles required; permission in `x-platform-permission`).
      Staff sessions must come from an MFA sign-in (`403 mfa_required`, ADM-007). They expire after 30 min idle
      or 12 h absolute for admin routes (`401 reauthentication_required`, ADM-008). Mutations and sensitive reads
      require `X-Audit-Justification` (`400 justification_required`, ADM-009).

paths:
  # ───────────────────────────── Health (Phase 0) ─────────────────────────────
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the process is running. Performs no dependency checks.
      security: []
      x-phase: 0
      x-requirements: [NFR-010]
      x-rate-limit-class: none
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessStatus' }
              example: { status: ok }
  /internal/jobs/tick:
    get:
      tags: [internal]
      operationId: runJobsTickGet
      summary: Run one bounded job tick (scheduler; Vercel Cron uses GET)
      description: |
        Recovers jobs abandoned by crashed workers, relays unpublished outbox events into subscriber jobs and
        runs due jobs within `JOBS_TICK_BUDGET_SECONDS` (ADR-0004, BL-1.09). For serverless deployments without
        a long-running worker. Authenticated with `Authorization: Bearer <CRON_SECRET>`; returns `404` when
        `CRON_SECRET` is not configured.
      security: [{ cronSecret: [] }]
      x-phase: 1
      x-internal: true
      x-requirements: [NFR-006]
      x-rate-limit-class: none
      responses:
        '200': { $ref: '#/components/responses/JobTick' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [internal]
      operationId: runJobsTick
      summary: Run one bounded job tick (scheduler)
      description: Same as the GET form.
      security: [{ cronSecret: [] }]
      x-phase: 1
      x-internal: true
      x-requirements: [NFR-006]
      x-rate-limit-class: none
      responses:
        '200': { $ref: '#/components/responses/JobTick' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: Checks critical dependencies (PostgreSQL, Redis). Returns 503 when not ready to receive traffic.
      security: []
      x-phase: 0
      x-requirements: [NFR-010]
      x-rate-limit-class: none
      responses:
        '200':
          description: Ready (`status = ready`; every check `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
              example: { status: ready, checks: { database: ok, redis: ok } }
        '503':
          description: Not ready (`status = not_ready`; at least one check `fail`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
              example: { status: not_ready, checks: { database: ok, redis: fail } }

  # ───────────────────────────── Config & catalogs ─────────────────────────────
  /v1/client-config:
    get:
      tags: [config]
      operationId: getClientConfig
      summary: Client bootstrap configuration
      description: Feature flags, minimum supported app version and supported locales. Callable anonymously; authenticated callers may receive user-targeted flags.
      security: [{}, { bearerAuth: [] }]
      x-phase: 0
      x-requirements: [I18N-001]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClientPlatform' }
        - name: app_version
          in: query
          required: true
          schema: { type: string, pattern: '^\d+\.\d+\.\d+$' }
      responses:
        '200':
          description: Client configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfig' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/catalog/travel-interests:
    get:
      tags: [config]
      operationId: getTravelInterestCatalog
      summary: Travel styles and interests catalog (localized labels)
      security: [{}, { bearerAuth: [] }]
      x-phase: 1
      x-requirements: [AUTH-010, PROF-004, I18N-003]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelInterestCatalog' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Auth (Phase 1) ─────────────────────────────
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a platform account from an IdP ID token
      description: |
        The client signs in with the OIDC identity provider (email/password, Apple or Google) and sends the IdP
        ID token together with `client` (`ios`, `android` or `web`), which is recorded on the session. Web clients
        call this from the Next.js BFF after an OIDC Authorization Code + PKCE flow (ADR-0011). Browsers never
        see the platform tokens. The server verifies it (signature, `iss`, `aud`, `exp`, `nonce`), applies the age gate,
        records consents, provisions the user, and issues a platform session.
        `birth_date` is used transiently for the age gate; only the birth year is persisted.
        If the IdP identity is already linked to an account, returns `409 conflict` (client should call `/v1/auth/login`).
      security: []
      x-phase: 1
      x-requirements: [AUTH-001, AUTH-002, AUTH-003, SAFE-001]
      x-rate-limit-class: auth
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '403':
          description: '`age_restricted` — the user does not meet the minimum age policy.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange an IdP ID token for a platform session
      description: Maps `(iss, sub)` to an existing account and issues a new session for the device. `client` (`ios`, `android`, `web`) is recorded on the session and shown in session lists. Returns `404 not_found` if no account is linked (client should route to registration). Logging in during the deletion grace period cancels the pending deletion.
      security: []
      x-phase: 1
      x-requirements: [AUTH-004, AUTH-005]
      x-rate-limit-class: auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`account_suspended`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Refresh tokens are single-use and rotate on every call.

        **Reuse leeway (ADR-0011).** If the *immediately previous* refresh token of a family is presented within
        **30 s** of its rotation, the server returns the **same successor pair** that the first call produced. It
        does not mint a third pair and does not revoke anything. This keeps parallel refreshes (several browser
        tabs or concurrent requests behind the web BFF) from logging the user out.

        **Reuse detection.** Presenting a rotated token after the 30 s leeway, or any older ancestor token at any
        time, is treated as token theft. The entire token family (the session) is revoked, open WebSockets for
        the session receive `session.revoked`, and the call fails with `401 refresh_token_reused`.

        Other failures: `401 token_invalid` (unknown or malformed), `401 session_revoked` (session already revoked
        or the account suspended), `401 token_expired` (refresh lifetime elapsed).
      security: []
      x-phase: 1
      x-requirements: [AUTH-006, AUTH-009]
      x-rate-limit-class: auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair, or, within the 30 s leeway, the identical successor pair already issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401':
          description: '`refresh_token_reused` (family revoked), `token_invalid`, `token_expired`, or `session_revoked`.'
          headers:
            X-Request-ID: { $ref: '#/components/headers/XRequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session (or all sessions)
      x-phase: 1
      x-requirements: [AUTH-007]
      x-rate-limit-class: write
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session(s) revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Development-only IdP (Phase 1) ─────────────────────────────
  /v1/dev/idp/token:
    post:
      tags: [auth]
      operationId: devIdpMintToken
      summary: DEVELOPMENT ONLY — mint a test OIDC ID token
      description: |
        **Exists only when `APP_ENV ∈ {development, test}`. Returns `404` in staging and production**, and the
        process refuses to boot with the dev IdP enabled there. The token is an EdDSA (Ed25519) JWT with
        `kid = dev-1`, `iss = urn:travelbuddy:dev-idp`, `aud = travelbuddy-api`, claims
        `sub`, `email`, `email_verified`, `name`, `iat`, `exp` (10 min), optional `nonce`, and `amr = ["dev"]`
        (`["dev", "mfa"]` when `mfa: true`).
        It is consumed by `/v1/auth/register` and `/v1/auth/login` through the **same** OIDC verifier as
        production tokens (the verifier is chosen by the token's `iss`).
      security: []
      x-phase: 1
      x-dev-only: true
      x-requirements: [AUTH-001]
      x-rate-limit-class: auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevIdpTokenRequest' }
      responses:
        '200':
          description: Token minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevIdpToken' }
        '404':
          description: Not available in this environment.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/dev/idp/jwks.json:
    get:
      tags: [auth]
      operationId: devIdpJwks
      summary: DEVELOPMENT ONLY — JWKS for the dev IdP (Ed25519 public key `dev-1`)
      security: []
      x-phase: 1
      x-dev-only: true
      x-requirements: [AUTH-001]
      x-rate-limit-class: read
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '404':
          description: Not available in this environment.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────── Me (Phase 1) ─────────────────────────────
  /v1/users/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get my account, profile, preferences, privacy, roles, onboarding state, browse destination and entitlements
      description: One bootstrap call for clients. `entitlements` is the same `Entitlements` object returned by `GET /v1/billing/entitlements`.
      x-phase: 1
      x-requirements: [PROF-001, AUTH-010, BILL-002, SAFE-013]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Me.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update my profile
      description: |
        Partial update: omitted fields are unchanged; `null` clears the nullable fields (`bio`, `avatar_media_id`,
        `home_country_code`, `home_region`). Text is normalized (whitespace collapsed, invisible/bidi control
        characters removed); list fields are de-duplicated case-insensitively.
        **Handle** (PROF-003): case-insensitively unique (`409 conflict`). Reserved names are rejected with
        `422` and `errors[].code = reserved`. The handle generated at registration can be replaced at once;
        after that, one change per 30 days (`422`, `errors[].code = change_too_soon`, top-level `next_change_at`).
        `avatar_media_id` must reference a finalized upload of the caller (`errors[].code = not_found` otherwise).
      x-phase: 1
      x-requirements: [PROF-001, PROF-002, PROF-004]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMyProfileRequest' }
      responses:
        '200':
          description: Updated Me.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: '`conflict` — handle already taken.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/onboarding/complete:
    post:
      tags: [me]
      operationId: completeOnboarding
      summary: Mark onboarding as completed (idempotent)
      description: Requires the mandatory onboarding fields (`handle`, `display_name`, `ui_locale`). Optional steps (photo, interests, destinations, location and discovery preferences) may be skipped. Fails with `validation_failed` listing missing fields.
      x-phase: 1
      x-requirements: [AUTH-010, FEED-001]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Onboarding completed. Returns Me with `onboarding_completed = true`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: List my active sessions (devices)
      x-phase: 1
      x-requirements: [AUTH-008]
      x-rate-limit-class: read
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: Revocation takes effect at the next refresh. Open WebSockets for the session receive `session.revoked` and are closed.
      x-phase: 1
      x-requirements: [AUTH-008]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/preferences:
    get:
      tags: [me]
      operationId: getMyPreferences
      summary: Get my preferences (locale, time zone, currency, notifications)
      x-phase: 1
      x-requirements: [PROF-005, I18N-002]
      x-rate-limit-class: read
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMyPreferences
      summary: Update my preferences
      description: |
        `ui_locale` must be one of `client-config.supported_locales` (`errors[].code = unsupported`). `time_zone` must
        be an IANA zone (`errors[].code = unknown`). `notification_settings` is **merged** per notification type and
        channel: only the channels sent change. The response returns explicit choices only; clients apply their
        defaults to missing entries.
      x-phase: 1
      x-requirements: [PROF-005, I18N-002]
      x-rate-limit-class: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/privacy:
    get:
      tags: [me]
      operationId: getMyPrivacySettings
      summary: Get my privacy settings
      x-phase: 1
      x-requirements: [PROF-006, DISC-001, SAFE-010, PROF-008]
      x-rate-limit-class: read
      responses:
        '200':
          description: Privacy settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMyPrivacySettings
      summary: Update my privacy settings
      description: Enabling `discovery_enabled` requires a current `traveler_discovery` consent record (`403 consent_required` with top-level `consent_type`, otherwise). Disabling discovery immediately ends any active discovery session. Changing `search_engine_indexing` appends a `search_indexing` consent record.
      x-phase: 1
      x-requirements: [PROF-006, DISC-001, DISC-002, PROF-008, SAFE-012]
      x-rate-limit-class: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePrivacySettingsRequest' }
      responses:
        '200':
          description: Updated privacy settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`consent_required` or `age_restricted`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/me/consents:
    get:
      tags: [me]
      operationId: listMyConsents
      summary: Current state of each consent type
      x-phase: 1
      x-requirements: [AUTH-009]
      x-rate-limit-class: read
      responses:
        '200':
          description: Latest record per consent type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConsentRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [me]
      operationId: recordMyConsent
      summary: Grant or withdraw a consent (append-only record)
      description: Withdrawing `traveler_discovery` disables discovery and ends active sessions. Withdrawing `location` stops server use of device location for "Nearby". `search_indexing` is the same switch as `PrivacySettings.search_engine_indexing`. `terms` and `privacy_policy` cannot be withdrawn here (`errors[].code = cannot_withdraw`; that is account deletion) and only their current version can be accepted (`outdated_version`).
      x-phase: 1
      x-requirements: [AUTH-009, DISC-001]
      x-rate-limit-class: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '201':
          description: Consent recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
