    get:
      tags: [destinations]
      operationId: listFeaturedDestinations
      summary: Featured destinations (editorially managed)
      security: [{}, { bearerAuth: [] }]
      x-phase: 1
      x-requirements: [DEST-003, DEST-004]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
