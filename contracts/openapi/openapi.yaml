    get:
      tags: [destinations]
      operationId: searchDestinations
      summary: Search destinations by localized name
      description: Accent- and case-insensitive trigram search over localized names. Results are localized via `Accept-Language`.
      security: [{}, { bearerAuth: [] }]
      x-phase: 1
      x-requirements: [DEST-001, LOC-002, I18N-004]
      x-rate-limit-class: search
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: kind
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/DestinationKind' }
          style: form
          explode: false
        - name: country
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matches (best first). `page.next_cursor` is always null for search.
