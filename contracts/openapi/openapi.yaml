  # ───────────────────────────── AI travel assistant (Phase 4) ─────────────────────────────
  /v1/ai/itineraries/generate:
    post:
      tags: [ai]
      operationId: generateItinerary
      summary: Generate a structured, schema-validated itinerary proposal (asynchronous)
      description: |
        Returns `202` with a generation resource to poll (or await via the realtime `notification.new`).
        Output is grounded: each activity references a catalog `place_id` from the destination or is flagged
        `unverified: true`. The AI never generates opening hours, prices, ticket or reservation availability,
        live transit schedules or safety guarantees. Where licensed place data exists, the server joins it with
        `data_freshness_at`. The prompt contains only trip parameters, interests and catalog data: never
        exact locations, private messages or other users' data. Counts against quota `ai.itinerary_generations`.
      x-phase: 4
      x-requirements: [AI-001, AI-002, AI-003, AI-004, AI-005, AI-006, AI-010]
      x-rate-limit-class: ai
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateItineraryRequest' }
      responses:
        '202':
          description: Generation accepted.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGeneration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`quota_exceeded` is returned as 409; 403 covers `consent_required` (AI personalization) and `feature_disabled`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`quota_exceeded` or `idempotency_key_reused`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/ai/generations/{generationId}:
    get:
      tags: [ai]
      operationId: getAIGeneration
      summary: Poll an AI generation (owner only)
      x-phase: 4
