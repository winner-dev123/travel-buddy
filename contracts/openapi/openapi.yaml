  # ───────────────────────────── Billing (Phase 3) ─────────────────────────────
  /v1/billing/products:
    get:
      tags: [billing]
      operationId: listBillingProducts
      summary: Purchasable products for a platform (prices come from the store or provider SDK)
      security: [{}, { bearerAuth: [] }]
      x-phase: 3
      x-requirements: [BILL-001]
      x-rate-limit-class: read
      parameters:
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ProductPlatform' }
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/entitlements:
    get:
      tags: [billing]
      operationId: getEntitlements
      summary: My entitlements, computed server-side (the canonical source for every client)
      description: Union of all active grants across providers (Apple, Google, Stripe, promo, admin). Clients use this only to render UI. Every gated action is re-checked server-side.
      x-phase: 3
      x-requirements: [BILL-002, BILL-003, BILL-007]
      x-rate-limit-class: read
      responses:
        '200':
          description: Entitlements.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/purchases/verify:
    post:
      tags: [billing]
      operationId: verifyPurchase
      summary: Verify a store purchase with Apple/Google and link it to my account
      description: |
        The server verifies the signed transaction (Apple App Store Server API, JWS) or purchase token (Google
        Play Developer API) directly with the store and never trusts client-asserted status. A transaction already
        linked to a different account fails with `purchase_already_linked`. Stripe purchases are not verified here;
        they arrive through checkout sessions and webhooks.
      x-phase: 3
      x-requirements: [BILL-004, BILL-005, BILL-003, BILL-007]
      x-rate-limit-class: billing
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPurchaseRequest' }
      responses:
        '200':
          description: Verified; current entitlements returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyPurchaseResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: '`purchase_already_linked` or `idempotency_key_reused`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`purchase_invalid` or `validation_failed`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/purchases/restore:
    post:
      tags: [billing]
      operationId: restorePurchases
      summary: Restore store purchases (re-verify all supplied transactions)
      x-phase: 3
      x-requirements: [BILL-006]
      x-rate-limit-class: billing
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestorePurchasesRequest' }
      responses:
        '200':
          description: Current entitlements after restore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlements' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/checkout-sessions:
    post:
      tags: [billing]
      operationId: createCheckoutSession
      summary: Start a web checkout (Stripe Checkout hosted page)
      description: |
        Web only (ADR-0012). The backend creates a Stripe Checkout Session for a `platform = web` product and
        returns its hosted URL. Card data never touches platform servers. `success_path` and `cancel_path` are
        **relative paths** on the configured web origin. Absolute URLs are rejected, which prevents open redirects.
        Completing checkout grants nothing by itself: entitlements are granted only when the signature-verified
        Stripe webhook is processed. The client polls `GET /v1/billing/entitlements`. Fails with `conflict` if an
        active entitlement from any provider already covers the product (no double charging).
      x-phase: 3
      x-requirements: [BILL-002, BILL-003]
      x-rate-limit-class: billing
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckoutSessionRequest' }
      responses:
        '201':
          description: Checkout session created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectUrl' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`conflict` (already entitled) or `idempotency_key_reused`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/portal-sessions:
    post:
      tags: [billing]
      operationId: createBillingPortalSession
      summary: Open the Stripe Customer Portal for web-purchased subscriptions
      description: Returns `404 not_found` if the user has no Stripe customer. Store-purchased subscriptions are managed in the App Store or Google Play, and the client links there instead.
      x-phase: 3
      x-requirements: [BILL-005]
      x-rate-limit-class: billing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                return_path:
                  type: string
                  pattern: '^/[A-Za-z0-9/_\-.~%?=&]*$'
                  maxLength: 512
                  description: Relative path on the configured web origin.
      responses:
        '201':
          description: Portal session created.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectUrl' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/webhooks/apple:
    post:
      tags: [billing]
      operationId: receiveAppleNotification
      summary: App Store Server Notifications v2 (signed JWS payload; no bearer auth)
      description: The `signedPayload` certificate chain is verified against Apple's root CA. Stored once by `notificationUUID` (idempotent) and processed asynchronously. Returns `200` once durably stored, so Apple stops retrying.
      security: []
      x-phase: 3
      x-requirements: [BILL-007, BILL-008]
      x-rate-limit-class: webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleNotificationRequest' }
      responses:
        '200': { description: Stored (or already stored). }
        '400':
          description: '`bad_request` — signature or certificate-chain verification failed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/webhooks/google:
    post:
      tags: [billing]
      operationId: receiveGoogleNotification
      summary: Google Play Real-time Developer Notifications via Pub/Sub push (OIDC-authenticated)
      description: The Pub/Sub push OIDC token (audience = this endpoint) is verified. Stored once by `message.messageId`. Processing re-reads the subscription state from the Play Developer API, because notification payloads are not authoritative.
      security:
        - pubsubOidc: []
      x-phase: 3
      x-requirements: [BILL-007, BILL-008]
      x-rate-limit-class: webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GooglePubSubPushRequest' }
      responses:
        '204': { description: Stored (or already stored). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/billing/webhooks/stripe:
    post:
      tags: [billing]
      operationId: receiveStripeEvent
      summary: Stripe webhook events (signature-verified; no bearer auth)
      description: |
        The `Stripe-Signature` header is verified (HMAC-SHA256 with the endpoint secret, 5-minute timestamp
        tolerance) against the **raw** request body, before any parsing. Events are stored once by `event.id`
        (idempotent) and processed asynchronously into subscriptions and entitlements. Processing re-fetches the
        subscription from the Stripe API, because event ordering is not guaranteed. Only an allow-listed set of
        event types is processed. Others are stored as `ignored`.
      security: []
      x-phase: 3
      x-requirements: [BILL-007, BILL-008, BILL-006]
      x-rate-limit-class: webhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 2048 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StripeEventRequest' }
      responses:
        '200': { description: Stored (or already stored). }
        '400':
          description: '`bad_request` — signature verification failed or timestamp outside tolerance.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

