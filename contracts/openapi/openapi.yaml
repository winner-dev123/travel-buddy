  # ───────────────────────────── Feed (Phase 1) ─────────────────────────────
  /v1/feed:
    get:
      tags: [feed]
      operationId: getFeed
      summary: Location-based travel feed
      description: |
        Relevance derives from **post destination metadata**, never from author nationality, residence or IP.

        Destination resolution for `for_you` / `destinations` follows the PRD FEED-001 fallback chain. The first
        match wins and is reported in `context.source`:
        1. `gps`: the point from `near`, resolved to its containing destination (not stored).
        2. `selected`: the explicit `destination_id` parameter, otherwise the user's browse destination.
        3. `upcoming_trip`: declared upcoming destinations or trip destinations.
        4. `interests`: content matching the user's travel interests.
        5. `global`: globally popular content.

        An explicit `destination_id` always overrides `near`. `nearby` ranks destination-tagged **content** near
        `near` (requires `near`; `context.source = gps`, `context.radius_km` set). It is unrelated to people discovery.
        `following` shows posts from followed accounts (`context.source = following`), still honouring visibility
        and blocks.

        Pages are served from a ranked snapshot (15 min). If the snapshot expired, the server recomputes it and
        sets `page.reset = true`. The client should then replace, not append, the list.
      x-phase: 1
      x-requirements: [FEED-001, FEED-002, FEED-003, FEED-004, FEED-020, FEED-021, LOC-007, LOC-008]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: tab
          in: query
          required: false
          schema: { $ref: '#/components/schemas/FeedTab' }
        - name: destination_id
          in: query
          required: false
          description: City, neighborhood, region or country to browse. Includes content tagged to descendants.
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/NearOptional'
        - name: radius_km
          in: query
          required: false
          description: '`nearby` tab only. Discovery radius for content.'
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: country
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: category
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/PostKind' }
          style: form
          explode: false
        - name: tag
          in: query
          required: false
          schema:
            type: array
            maxItems: 5
            items: { type: string, maxLength: 40 }
          style: form
          explode: false
        - name: language
          in: query
          required: false
          description: Restrict to content languages (BCP 47). Defaults to the user's `content_languages` preference (empty = all).
          schema:
            type: array
            items: { $ref: '#/components/schemas/LocaleTag' }
          style: form
          explode: false
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [ranked, recent, popular], default: ranked }
        - name: saved_destinations_only
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Feed page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/feed/feedback:
    post:
      tags: [feed]
      operationId: submitFeedFeedback
      summary: Negative feedback on a feed item ("hide", "not interested", "see less from author")
      x-phase: 1
