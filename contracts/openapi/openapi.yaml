        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [challenges]
      operationId: createChallenge
      summary: Create a riddle challenge (draft) — `challenges.manage` + entitlement `challenges.create` on the group
      description: |
        Accepted answers are write-only: they are never returned by any member-facing endpoint. Prize types are
        limited to badges, non-transferable achievements, sponsor discount codes and documented non-cash
        promotional rewards. Paid entry, wagers, random draws and cash or cash-equivalent prizes are rejected
