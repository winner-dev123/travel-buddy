  /v1/public/posts:
    get:
      tags: [feed]
      operationId: listPublicPosts
      summary: Guest mode — public destination content (anonymous, capped)
      description: |
        No authentication. Only posts with `visibility = public` and `moderation_state = approved` from active,
        public accounts. Capped at 3 pages (60 posts) per cursor chain. A cursor beyond the cap returns an empty
        page with `has_more = false`. Uses `PublicPost`, which carries no viewer-specific fields. Guests cannot
