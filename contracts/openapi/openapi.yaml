  /v1/users/me/discovery-location:
    get:
      tags: [location]
      operationId: getDiscoverySession
      summary: Get my active traveler-discovery session
      x-phase: 2
      x-requirements: [DISC-003, LOC-006]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverySession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: No active session.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [location]
      operationId: setDiscoverySession
      summary: Start or replace my traveler-discovery session
      description: |
        Requires `discovery_enabled = true` in privacy settings and a current `traveler_discovery` consent.
        The body names a destination directly, or supplies a GPS point that the server resolves to the
        containing city (and neighborhood, if `discovery_granularity = neighborhood`) with PostGIS and then
        **discards**. Coordinates are never stored, logged, or echoed. The response contains only the resolved
        destinations. Sessions expire after `duration_hours` (default 24, max 72).
      x-phase: 2
      x-requirements: [DISC-001, DISC-003, DISC-004, LOC-006, LOC-007, SAFE-011]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDiscoverySessionRequest' }
      responses:
        '200':
          description: Session active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverySession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`discovery_disabled`, `consent_required` or `age_restricted`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`validation_failed` or `location_unresolvable` (point is outside any known destination).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [location]
      operationId: endDiscoverySession
      summary: End my discovery session immediately (become undiscoverable)
      x-phase: 2
      x-requirements: [DISC-005]
      x-rate-limit-class: write
      responses:
        '204': { description: Session ended (idempotent). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }

