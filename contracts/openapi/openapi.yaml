        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Realtime tickets (Phase 3, ADR-0013) ─────────────────────────────
  /v1/realtime/tickets:
    post:
      tags: [realtime]
      operationId: createRealtimeTicket
      summary: Mint a single-use ticket to authenticate a browser WebSocket
      description: |
        For browser clients, which cannot read the access token (ADR-0011, ADR-0013). The web BFF calls this with
        the session's Bearer token and passes the ticket to the browser, which sends it in the first realtime
        `auth` frame as `{"ticket": "…"}`.

        The ticket is a 256-bit random value, base64url-encoded. It is stored only as a SHA-256 hash in Redis,
        is **single use**, expires after **30 s**, and is bound to the caller's `user_id` and `session_id`. It
        never appears in a URL. The gateway consumes it atomically (`GETDEL`), and revoking the bound session
        also invalidates outstanding tickets. Mobile clients authenticate with `access_token` and do not need
        tickets. The response is `Cache-Control: no-store`.
      x-phase: 3
      x-requirements: [DM-003, AUTH-011]
      x-rate-limit-class: realtime_ticket
      responses:
        '201':
          description: Ticket issued.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeTicket' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Messaging (Phase 3) ─────────────────────────────
  /v1/conversations:
    get:
      tags: [messaging]
      operationId: listConversations
      summary: List my conversations (most recent activity first)
      x-phase: 3
      x-requirements: [DM-001, GCHAT-001]
      x-rate-limit-class: read
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ConversationKind' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [messaging]
      operationId: openDirectConversation
      summary: Open (get or create) a direct conversation with a connected user
      description: Requires an accepted connection (`connection_required`). Blocks in either direction return `404`. Exactly one direct conversation exists per pair, so this call is naturally idempotent.
      x-phase: 3
      x-requirements: [DM-001, DM-002]
      x-rate-limit-class: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenDirectConversationRequest' }
      responses:
        '200':
          description: Existing conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Conversation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`connection_required`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/conversations/{conversationId}:
    get:
      tags: [messaging]
      operationId: getConversation
      summary: Get a conversation (members only)
      x-phase: 3
      x-requirements: [DM-001, DM-011]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      summary: Message history and missed-message sync (seq keyset)
      description: |
        Messages are ordered by per-conversation `seq`. Use `before_seq` to page backwards through history,
        or `after_seq` to sync forward after reconnecting or detecting a gap. Exactly one of the two may be
        supplied. With neither, the most recent messages are returned. Respects `joined_at_seq` (history
        boundary for new group members) and `cleared_through_seq`. This seq keyset replaces the opaque cursor
        for messages because clients must address positions directly for gap repair.
      x-phase: 3
      x-requirements: [DM-003, DM-010, DM-011]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: before_seq
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: after_seq
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Messages in ascending `seq` order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [messaging]
      operationId: sendMessage
      summary: Send a message (REST fallback; same service path as the realtime `message.send`)
      description: |
        Persisted before acknowledgement. Idempotent on `(conversation, sender, client_message_id)`: a retry
        returns the original message with `200` and the `Idempotent-Replayed: true` header. Authorization is
        re-checked on every send (membership, block state, connection for direct, member restriction,
        `chat_mode`). Attachments must be media with purpose `message`.
      x-phase: 3
      x-requirements: [DM-004, DM-005, DM-012, DM-013, GCHAT-002, SAFE-005]
      x-rate-limit-class: message
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: Idempotent replay — the message already existed.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Message persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`connection_required`, `member_restricted`, `chat_admins_only`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
