  # ───────────────────────────── Safety: blocks & reports (Phase 1) ─────────────────────────────
  /v1/users/me/blocks:
    get:
      tags: [safety]
      operationId: listMyBlocks
      summary: List users I have blocked
      x-phase: 1
      x-requirements: [SAFE-001]
      x-rate-limit-class: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Blocked users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/users/{userId}/block:
    put:
      tags: [safety]
      operationId: blockUser
      summary: Block a user
      description: |
        Takes effect immediately and bidirectionally. In one transaction it removes follows in both directions,
        removes any connection, cancels pending connection requests, revokes direct-message send rights, hides
        content in feeds, removes both users from each other's discovery results, and suppresses typing and
        receipts. Shared group membership is unaffected, but group-chat messages from the blocked user are
        collapsed client-side. The blocked user is not notified.
      x-phase: 1
      x-requirements: [SAFE-001, CONN-009, DM-012, DISC-010]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Blocked (idempotent). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [safety]
      operationId: unblockUser
      summary: Unblock a user (does not restore follows or connections)
      x-phase: 1
      x-requirements: [SAFE-001]
      x-rate-limit-class: write
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Unblocked (idempotent). }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/reports:
    post:
      tags: [safety]
      operationId: createReport
      summary: Report a user, post, comment, message, group, challenge or media
      description: |
        A content snapshot is captured server-side as evidence. Reporting a message grants moderators access to
        that message and limited surrounding context only. A duplicate open report by the same reporter
